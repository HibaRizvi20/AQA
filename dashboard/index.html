<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQA Cycles Explorer</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--surface2:#eef1f5;--border:#e2e6ec;--ink:#0f1216;--muted:#5a6472;--faint:#8a93a1;--accent:#4f46e5;--accent-soft:#ecebfb;--ok:#12a150;--ok-soft:#e6f6ec;--gate:#b7791f;--gate-soft:#fbf1df;--fail:#d64550;--fail-soft:#fce8ea;--run:#2f6feb;--run-soft:#e6effc;--stub:#8a93a1;--stub-soft:#f1f3f6;--mono:ui-monospace,Menlo,Consolas,monospace;--shadow:0 1px 2px rgba(16,18,22,.05),0 8px 24px rgba(16,18,22,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0c0e12;--surface:#14171d;--surface2:#1b1f27;--border:#262b34;--ink:#e8ebf0;--muted:#98a2b2;--faint:#69727f;--accent:#8b83ff;--accent-soft:#1e1b3a;--ok:#3fb950;--ok-soft:#12241a;--gate:#d6a531;--gate-soft:#2a2113;--fail:#f0616a;--fail-soft:#2a1417;--run:#5b9bff;--run-soft:#14233d;--stub:#69727f;--stub-soft:#191d24;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:700;color:var(--accent);margin:0 0 5px}
h1{font-size:clamp(21px,2.8vw,28px);line-height:1.12;margin:0 0 5px;letter-spacing:-.02em}
.subt{color:var(--muted);font-size:13.5px;margin:0;max-width:80ch}
.crumb{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--faint);margin-bottom:10px;flex-wrap:wrap}
.crumb button{background:none;border:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
.crumb span.sep{opacity:.5}
.search{display:flex;gap:10px;align-items:center;margin:18px 0 6px}
.search input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font:inherit;font-size:14px;color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.count{font-size:12.5px;color:var(--faint);white-space:nowrap}
.cycles{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.cyc{display:grid;grid-template-columns:1fr 200px 190px 130px;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 17px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%;font:inherit;color:inherit}
.cyc:hover{border-color:var(--accent)}
@media(max-width:860px){.cyc{grid-template-columns:1fr;gap:9px}}
.cyc-id{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.03em}
.cyc-n{font-weight:650;font-size:15.5px;margin-top:2px}
.cyc-m{color:var(--muted);font-size:12px;margin-top:3px}
.cyc-stats{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.cyc-stats b{color:var(--ink);font-family:var(--mono);font-size:12px}
.agbar{display:flex;gap:3px;margin-top:5px}
.agbar i{flex:1;height:7px;border-radius:2px;background:var(--stub-soft);border:1px solid var(--border)}
.agbar i.ok{background:var(--ok);border-color:var(--ok)}
.agbar i.gate{background:var(--gate);border-color:var(--gate)}
.agbar i.na{background:var(--stub);border-color:var(--stub);opacity:.35}
.agcap{font-size:10.5px;color:var(--faint);margin-top:4px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.gate{background:var(--gate-soft);color:var(--gate)}.pill.fail{background:var(--fail-soft);color:var(--fail)}.pill.run{background:var(--run-soft);color:var(--run)}.pill.muted{background:var(--stub-soft);color:var(--faint)}
.empty{color:var(--faint);font-size:13.5px;text-align:center;padding:34px}
.back{display:inline-flex;gap:7px;align-items:center;background:none;border:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:2px}
.dhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin:2px 0 3px}.dhead h2{font-size:22px;margin:0;letter-spacing:-.015em}
.kv{font-size:12.5px;color:var(--muted)}.kv b{color:var(--ink);font-family:var(--mono);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 4px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .n{font-size:23px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
.tile .l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:2px}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.sec{margin-top:26px}
.sec h3{font-size:15px;margin:0 0 3px;letter-spacing:-.01em}
.sec .h-sub{font-size:12.5px;color:var(--muted);margin:0 0 9px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:11px;background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:600px}
th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);background:var(--surface2);white-space:nowrap}
td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:none}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--accent-soft)}
.mono{font-family:var(--mono);font-size:12px}
.cid{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.arrowc{color:var(--faint);text-align:right;white-space:nowrap}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:820px){.agrid{grid-template-columns:1fr}}
.agcard{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.agcard:hover{border-color:var(--accent)}
.agcard.dim{opacity:.62}
.agnum{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;width:24px;height:22px;display:grid;place-items:center}
.agnum.na{color:var(--faint);background:var(--stub-soft)}
.agn{font-weight:650;font-size:13.5px;display:block}
.agi{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:1px;display:block}
.agr{font-size:12px;color:var(--muted);margin-top:4px;display:block;line-height:1.45}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0 10px;color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.divider:after{content:"";flex:1;height:1px;background:var(--border)}
.layout{display:grid;grid-template-columns:246px 1fr;gap:18px;align-items:start;margin-top:14px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;font-size:12.5px}
.nav-item:hover{border-color:var(--accent)}.nav-item.active{background:var(--accent-soft);border-color:var(--accent)}
.ni-dot{width:9px;height:9px;border-radius:50%;background:var(--stub);flex:none;opacity:.4}.ni-dot.ok{background:var(--ok);opacity:1}.ni-dot.gate{background:var(--gate);opacity:1}
.ni-n{font-family:var(--mono);font-size:10px;color:var(--faint);width:15px;flex:none}
.ni-a{font-weight:600;flex:1;line-height:1.25}
.ni-g{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:10px;background:var(--gate-soft);color:var(--gate)}.ni-g.ok{background:var(--ok-soft);color:var(--ok)}
.nav-lbl{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:12px 0 3px;padding-left:3px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:2px;flex-wrap:wrap}.p-head h3{font-size:18px;margin:0}.p-id{color:var(--faint);font-size:12px;font-family:var(--mono)}
.io{border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin:10px 0}.io.in{background:var(--surface2)}.io.out{background:var(--accent-soft)}
.io-h{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
.io p{font-size:13.5px;margin:6px 0}.arrow{text-align:center;font-size:11px;color:var(--faint);margin:2px 0}
pre{font-family:var(--mono);font-size:11.6px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 13px;overflow-x:auto;white-space:pre-wrap;margin:6px 0;line-height:1.5}
.gherkin .kw{color:var(--accent);font-weight:700}
.sub{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 3px}.sub2{font-size:11.5px;color:var(--faint);display:block;margin-top:6px;line-height:1.55}
.chip{font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted);display:inline-block;margin:2px 2px 0 0}
.sbar{display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--surface);margin:2px 0 8px;border:1px solid var(--border)}.seg{height:100%}.seg.ok{background:var(--ok)}.seg.gate{background:var(--gate)}.seg.stub{background:var(--stub)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.dot.ok{background:var(--ok)}.dot.gate{background:var(--gate)}.dot.stub{background:var(--stub)}.dot.fail{background:var(--fail)}
ol,ul{margin:6px 0;padding-left:20px}li{margin:4px 0;font-size:12.8px}
.banner{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 9px 9px 0;font-size:12.8px;margin:14px 0;color:var(--ink)}
.banner.warn{border-left-color:var(--gate);background:var(--gate-soft)}
.banner.bad{border-left-color:var(--fail);background:var(--fail-soft)}
.banner b{display:block;margin-bottom:2px}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint)}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   THE 12 AGENTS.
   8 gated agents (1-8) run inside the pipeline behind five human gates.
   4 async tracks (9-12) run on their own trigger and never block a merge.
   Pre-flight, Targeted Run and Regression are execution phases, not agents,
   so they carry no agent number.
   Every agent is also a standalone skill — the pipeline is one way to run
   them, not the only way.
   ───────────────────────────────────────────────────────────────────────── */
const PHASES=[
 {id:"00-preflight",    a:"Pre-flight",         kind:"check"},
 {id:"01-scope",        a:"Scope Analyst",      kind:"agent", n:1},
 {id:"02-architecture", a:"Test Architect",     kind:"agent", n:2, gate:"CP1"},
 {id:"03-case-design",  a:"Case Designer",      kind:"agent", n:3, gate:"CP2"},
 {id:"3b-publish",      a:"Tracker Publisher",  kind:"agent", n:4},
 {id:"04-generate",     a:"Test Generator",     kind:"agent", n:5, gate:"CP3"},
 {id:"05-targeted-run", a:"Targeted Run",       kind:"run",         gate:"CP4"},
 {id:"06-self-heal",    a:"Triage / Self-Heal", kind:"agent", n:6},
 {id:"07-regression",   a:"Regression",         kind:"run"},
 {id:"08-review",       a:"Reviewer",           kind:"agent", n:7, gate:"CP5"},
 {id:"09-finalise",     a:"KB Curator",         kind:"agent", n:8},
];
const ASYNC=[
 {id:"a09-performance",   a:"Performance & Logs", kind:"async", n:9},
 {id:"a10-design-parity", a:"Design Parity",      kind:"async", n:10},
 {id:"a11-ai-eval",       a:"AI Eval Analyst",    kind:"async", n:11},
 {id:"a12-drift",         a:"Drift Detector",     kind:"async", n:12},
];
const ALL=[...PHASES,...ASYNC];
const byId=id=>ALL.find(p=>p.id===id);

const CART={
"00-preflight":{in:`<p>The feature spec (a plain request, no tracker key yet):</p><pre>As a shopper I want to save items for later from my cart,\nso I can move them out of the active cart and bring them back.</pre>`,
 out:`<p>Checked prerequisites and probed the app:</p><span class="chip">deps: <b>ok</b></span><span class="chip">app reachable: <b>ok</b></span><span class="chip">"Save for later" control: <b>not built yet</b></span><p class="sub2">Surfaced (not masked): the control does not exist yet, so later phases skip honestly rather than invent selectors.</p>`},
"01-scope":{in:`<p>The spec. No epic to traverse, so the analyst decomposes it into candidate behaviours and classifies each.</p>`,
 out:`<div class="sbar"><span class="seg ok" style="width:75%"></span><span class="seg gate" style="width:12.5%"></span><span class="seg stub" style="width:12.5%"></span></div><div class="legend"><span><i class="dot ok"></i>In scope 6</span><span><i class="dot gate"></i>Deferred 1</span><span><i class="dot stub"></i>Out 1</span> · confidence 60%</div>
 <div class="sub">In scope</div><table><thead><tr><th>Behaviour</th><th>Area</th></tr></thead><tbody><tr><td>"Save for later" moves an item out of the active cart</td><td>cart</td></tr><tr><td>Saved items appear in a "Saved" list</td><td>cart</td></tr><tr><td>"Move to cart" returns a saved item</td><td>cart</td></tr><tr><td>Saved items persist across sessions</td><td>cart</td></tr><tr><td>Saved items are excluded from the cart total</td><td>cart</td></tr><tr><td>Remove a saved item</td><td>cart</td></tr></tbody></table>
 <div class="sub">Deferred</div><p>Saved-item price updates when the catalogue price changes — needs a pricing event, not a UI test.</p><div class="sub">Out of scope</div><p>Cart persistence storage internals → performance track.</p><p class="sub2">Confidence 0.60 — clear behaviour, but the control isn't built and no selectors exist to verify. Forces the CP1 review.</p>`},
"02-architecture":{in:`<p>The classified scope (6 in-scope behaviours, 1 deferred).</p>`,
 out:`<p>One objective per behaviour with a positive / negative / edge split.</p><table><thead><tr><th>Objective</th><th>+/–/edge</th></tr></thead><tbody><tr><td>Save for later moves the item</td><td><span class="pill ok">positive</span></td></tr><tr><td>Move to cart returns it</td><td><span class="pill ok">positive</span></td></tr><tr><td>Saved list persists across sessions</td><td><span class="pill ok">positive</span></td></tr><tr><td>Saved items excluded from total</td><td><span class="pill ok">positive</span></td></tr><tr><td>Save-for-later on an out-of-stock item is blocked</td><td><span class="pill fail">negative</span></td></tr><tr><td>Save the last cart item (cart goes empty)</td><td><span class="pill gate">edge</span></td></tr><tr><td>Remove a saved item</td><td><span class="pill muted">lifecycle</span></td></tr></tbody></table><p class="sub2"><b>Pilot:</b> save-for-later + move-to-cart.</p>`},
"03-case-design":{in:`<p>The objectives + the pos/neg/edge plan.</p>`,
 out:`<p>A co-located Gherkin feature — <span class="mono">tests/features/cart-save-for-later.feature</span> — stakeholder-readable, each scenario doubling as a test case.</p>
 <pre class="gherkin"><span class="kw">Feature:</span> Save cart items for later\n\n  <span class="kw">Background:</span>\n    <span class="kw">Given</span> I am signed in to Acme Shop\n    <span class="kw">And</span> I have two items in my cart\n\n  <span class="kw">Scenario:</span> AQA-201 Save an item for later\n    <span class="kw">When</span> I choose "Save for later" on an item\n    <span class="kw">Then</span> it moves to my "Saved" list and leaves the active cart\n\n  <span class="kw">Scenario:</span> AQA-202 Move a saved item back to the cart\n  <span class="kw">Scenario:</span> AQA-203 Saved items persist after I sign out and back in\n  <span class="kw">Scenario:</span> AQA-204 Saved items are not counted in the cart total\n  <span class="kw">Scenario:</span> AQA-205 Saving an out-of-stock item is blocked\n  <span class="kw">Scenario:</span> AQA-206 Saving the last cart item leaves an empty cart cleanly\n  <span class="kw">Scenario:</span> AQA-207 Remove a saved item</pre>
 <div class="sub">Tags — auto-stamped, pick by area / type</div><p><span class="chip">@area:cart</span><span class="chip">@type:happy ×4</span><span class="chip">@type:negative ×1</span><span class="chip">@type:edge ×1</span><span class="chip">@type:lifecycle ×1</span></p>
 <div class="sub2">~90% of the UI surface covered; the price-change-on-saved-item behaviour is deferred (needs a pricing event). Open questions at CP2: is there a saved-item cap? do saved items reserve stock?</div>`},
};
const BLOCKED=`<div class="banner warn"><b>Not reached</b>This run paused at CP2 because the "Save for later" control isn't built yet, so generation/run would have to invent selectors. Shown as it will run once the feature ships.</div>`;
for(const id of ["3b-publish","04-generate","05-targeted-run","06-self-heal","07-regression","08-review","09-finalise"]) CART[id]={in:BLOCKED,out:BLOCKED};

/* ── async track content, shared by the completed demo runs ─────────────── */
const ASYNC_DEMO={
"a09-performance":{in:`<p>Run history and per-step durations from the configured metrics API, plus a <b>declared budget per step</b>. Budgets are written down before the run, so a breach is a fact rather than a judgement call.</p>
 <pre>checkout.submit 800ms · cart.add 300ms · search.query 400ms
catalogue.list 250ms · auth.login 400ms</pre>`,
 out:`<p><b>One budget breach. Reported with evidence; nothing gated.</b></p>
 <table><thead><tr><th>Step</th><th>n</th><th>p50</th><th>p95</th><th>Budget</th><th>Verdict</th></tr></thead><tbody>
 <tr><td class="mono">checkout.submit</td><td>140</td><td class="mono">610</td><td class="mono">1180</td><td class="mono">800</td><td><span class="pill fail">breach</span></td></tr>
 <tr><td class="mono">search.query</td><td>140</td><td class="mono">180</td><td class="mono">340</td><td class="mono">400</td><td><span class="pill ok">ok</span></td></tr>
 <tr><td class="mono">cart.add</td><td>140</td><td class="mono">95</td><td class="mono">210</td><td class="mono">300</td><td><span class="pill ok">ok</span></td></tr>
 <tr><td class="mono">catalogue.list</td><td>140</td><td class="mono">70</td><td class="mono">160</td><td class="mono">250</td><td><span class="pill ok">ok</span></td></tr>
 <tr><td class="mono">auth.login</td><td>140</td><td class="mono">140</td><td class="mono">260</td><td class="mono">400</td><td><span class="pill ok">ok</span></td></tr>
 </tbody></table>
 <div class="banner"><b>PERF-01 · raised with evidence</b>checkout.submit p95 1180ms against a declared 800ms budget across 140 samples. Correlated with the logs for the same window. Filed as a bug because the budget was declared in advance — not because a number looked large.</div>
 <p class="sub2"><b>Report-only.</b> This track never gates a merge, and never files known non-determinism as a bug: runtime is driven by load × iterations, not one dimension alone. Output: <span class="mono">out/performance-&lt;date&gt;.json</span></p>`},

"a10-design-parity":{in:`<p>Two runnable things: a <b>design prototype</b> (a prototype URL, a Storybook, or a deployed design build) and the <b>live app</b>, driven through the same route and state.</p>`,
 out:`<div class="banner warn"><b>NOT CONFIGURED — reported as not-run, not as pass</b>No prototype source is connected for this target, so there is nothing to compare the built app against. The agent refuses to emit a green result it did not earn.</div>
 <p class="sub">What it does once a prototype is connected</p>
 <ul>
 <li>Drives prototype and live app through the <b>same route and state</b>, captures side-by-side screenshots.</li>
 <li>Compares across four axes — <b>visual / layout</b>, <b>flow</b>, <b>copy</b>, and <b>states</b> (empty, error, loading).</li>
 <li>Raises tickets for the <b>design team</b>, never product bugs, and never blocks the functional pipeline.</li>
 <li>Flags meaningful deviations only. A human triages each diff as regression versus deliberate evolution; not every pixel diff is a defect.</li>
 </ul>
 <p class="sub2">Dry-run by default. Output: <span class="mono">out/design-parity-&lt;date&gt;.json</span> (categorised diffs plus evidence).</p>`},

"a11-ai-eval":{in:`<p>A golden dataset (a human-approved answer key) and a trace endpoint — <b>LangGraph, Phoenix, LangSmith, or any OpenTelemetry-compatible tracer</b>. The organisation plugs in whichever it already runs.</p>`,
 out:`<div class="banner warn"><b>NOT APPLICABLE TO THIS TARGET — reported as not-run</b>This app exposes no AI assistant endpoint and no trace source, so there is nothing to score. Skipped honestly rather than reported as passing.</div>
 <p class="sub">What it does against an AI app</p>
 <ol>
 <li><b>Ask</b> — send each golden query to the assistant.</li>
 <li><b>Fetch the trace</b> — the final answer, every tool call with args and result, span statuses, latency.</li>
 <li><b>Score two ways</b> — LLM-as-judge on correctness, faithfulness, coherence and relevance (1–5), plus deterministic checks: expected tools present, no forbidden tools, no errored spans, latency inside budget.</li>
 <li><b>Aggregate</b> a scorecard, compare against baseline, flag regressions.</li>
 </ol>

/* ── helpers ────────────────────────────────────────────────────────────── */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const runsOf=c=>c.runs.map(id=>RUNS.find(r=>r.runId===id)).filter(Boolean);
function agentState(cyc,agent){
  for(const r of runsOf(cyc)){
    if((r.done||[]).includes(agent.id)) return "ok";
    if((r.na||[]).includes(agent.id))   return "na";
  }
  return runsOf(cyc).some(r=>r.awaiting&&agent.gate===r.awaiting)?"gate":"pending";
}
function agentTally(cyc){
  const nums=ALL.filter(p=>p.n); let ok=0,na=0,pend=0;
  for(const a of nums){const s=agentState(cyc,a); if(s==="ok")ok++; else if(s==="na")na++; else pend++;}
  return {ok,na,pend,total:nums.length};
}
function statusPill(x){
  if(x.status==="complete")return '<span class="pill ok">complete</span>';
  if(x.status==="paused")return '<span class="pill gate">paused · awaiting '+x.awaiting+'</span>';
  if(x.status==="running")return '<span class="pill run">running</span>';
  return '<span class="pill">'+esc(x.status)+'</span>';
}
const sevPill=s=>({high:'<span class="pill fail">high</span>',blocking:'<span class="pill fail">blocking</span>',medium:'<span class="pill gate">medium</span>',low:'<span class="pill muted">low</span>',info:'<span class="pill">info</span>'}[s]||'<span class="pill">'+esc(s)+'</span>');

    const bars=ALL.filter(p=>p.n).map(a=>{const s=agentState(c,a);return `<i class="${s==="ok"?"ok":s==="na"?"na":s==="gate"?"gate":""}" title="${a.n}. ${esc(a.a)} — ${s}"></i>`;}).join("");
    return `<button class="cyc" onclick="location.hash='#/cycle/${c.id}'">

/* ── LEVEL 3 · one run, one agent ──────────────────────────────────────── */
function autoIn(r,p){const M={"00-preflight":`Trigger: scope link <span class="mono">${esc(r.source)}:${esc(r.epicKey)}</span>.`,"01-scope":"The scope link — fetched its children.","02-architecture":"The scope artifact (01-scope).","03-case-design":"The plan (02-architecture).","3b-publish":"The approved Gherkin scenarios (03).","04-generate":"The features (03-case-design).","05-targeted-run":"The generated specs (04).","06-self-heal":"Failures from the targeted run (05).","07-regression":"The whole suite.","08-review":"The generated tests plus conventions.md.","09-finalise":"The run artifacts.","a09-performance":"The running app plus declared per-step budgets.","a10-design-parity":"A design prototype and the live app.","a11-ai-eval":"A golden dataset and a trace endpoint.","a12-drift":"The Feature Registry entries for this feature."};return "<p>"+(M[p.id]||"—")+"</p>";}
function autoOut(r,p){
  if((r.na||[]).includes(p.id)) return '<div class="banner warn"><b>Not configured for this target</b>Reported as not-run. The agent never emits a green result it did not earn.</div>';
  return (r.done||[]).includes(p.id)?"<p><b>"+esc(r.counts[p.id]||"done")+"</b></p>":'<p class="sub2">pending</p>';
}
function navState(r,p){
  if((r.done||[]).includes(p.id))return "ok";
  if((r.na||[]).includes(p.id))return "na";
  if(r.awaiting&&p.gate===r.awaiting)return "gate";
  return "";
}
function renderRun(runId,phaseId){
  const r=RUNS.find(x=>x.runId===runId);
  if(!r) return `<button class="back" onclick="location.hash='#/'">← all cycles</button><div class="empty">Run <b>${esc(runId)}</b> not found.</div>`;
  const cyc=CYCLES.find(c=>c.runs.includes(r.runId));
  const cur=phaseId&&byId(phaseId)?phaseId:(r.def||"01-scope");
  const item=p=>{
    const st=navState(r,p);
    const g=p.gate?`<span class="ni-g ${st==="ok"?"ok":""}">${p.gate}</span>`:"";
    const num=p.n?`<span class="ni-n">${p.n}</span>`:`<span class="ni-n" style="opacity:.4">·</span>`;
    return `<button class="nav-item ${p.id===cur?"active":""}" onclick="location.hash='#/run/${r.runId}/${p.id}'">
      <span class="ni-dot ${st==="na"?"":st}"></span>${num}<span class="ni-a">${esc(p.a)}</span>${g}</button>`;
  };
  const nav=`<div class="nav-lbl">Gated pipeline</div>${PHASES.map(item).join("")}
             <div class="nav-lbl">Async tracks · non-blocking</div>${ASYNC.map(item).join("")}`;

  const p=byId(cur);
  // Design Parity and AI Eval carry a target-independent explainer (they say why
  // they did not run, and what they would do), so they show on every run. The
  // Performance and Drift panels are real results, so they show only where the
  // track actually ran — never borrowed from another run.
  const ALWAYS_INFO=["a10-design-parity","a11-ai-eval"];
  const rich=(r.rich&&r.rich[cur]) || (ALWAYS_INFO.includes(cur)||(r.done||[]).includes(cur) ? ASYNC_DEMO[cur] : null) || null;
  const inHtml=rich?rich.in:autoIn(r,p), outHtml=rich?rich.out:autoOut(r,p);
  const st=navState(r,p);
  const head=[
    p.n?`<span class="pill muted">agent ${p.n} of 12</span>`:`<span class="pill muted">${p.kind==="run"?"execution phase":"pre-flight check"}</span>`,
    p.kind==="async"?'<span class="pill run">async · never blocks</span>':"",
    p.gate?`<span class="pill ${st==="gate"?"gate":"ok"}">${st==="gate"?"⏸ awaiting "+p.gate:"✓ "+p.gate}</span>`:"",
  ].filter(Boolean).join("");

  const crumb=cyc?`<div class="crumb"><button onclick="location.hash='#/'">Cycles</button><span class="sep">/</span><button onclick="location.hash='#/cycle/${cyc.id}'">${esc(cyc.name)}</button><span class="sep">/</span><span>${esc(r.runId)}</span></div>`
                 :`<div class="crumb"><button onclick="location.hash='#/'">Cycles</button><span class="sep">/</span><span>${esc(r.runId)}</span></div>`;

  return `${crumb}
  <div class="dhead"><h2>${esc(r.name)}</h2>${statusPill(r)}</div>
  <div class="kv">run <b>${esc(r.runId)}</b> · epic <b>${esc(r.epicKey)}</b> · ${esc(r.source)} · started ${esc(r.started)}</div>
  <div class="layout"><div class="nav">${nav}</div>
    <div class="panel"><div class="p-head"><span class="p-id">${p.id}</span><h3>${esc(p.a)}</h3>${head}</div>
      <div class="io in"><div class="io-h">▸ INPUT — what it received</div>${inHtml}</div>
      <div class="arrow">↓ passes to output ↓</div>
      <div class="io out"><div class="io-h">▪ OUTPUT — what it produced</div>${outHtml}</div>
    </div></div>`;
}

/* ── flat runs view — the original Runs Explorer, still here ────────────── */
function renderRuns(){
  const total=ALL.filter(x=>x.n).length;
  const rows=RUNS.map(r=>{
    const n=(r.done||[]).length, pct=Math.round(n/total*100);
    return `<button class="cyc" style="grid-template-columns:170px 1fr 170px 140px" onclick="location.hash='#/run/${r.runId}'">
      <div><div class="cyc-id" style="color:var(--accent);font-weight:600">${esc(r.runId)}</div><div class="cyc-m">${esc(r.epicKey)}</div></div>
      <div><div class="cyc-n" style="font-size:14px">${esc(r.name)}</div><div class="cyc-m">${esc(r.source)} · started ${esc(r.started)}</div></div>
      <div class="cyc-stats"><span><b>${n}</b> phases with output</span><div class="agbar"><i class="ok" style="flex:${pct||1}"></i><i style="flex:${100-pct||1}"></i></div></div>
      <div>${statusPill(r)}</div></button>`;
  }).join("");
  return `<div class="crumb"><button onclick="location.hash='#/'">Cycles</button><span class="sep">/</span><span>All runs</span></div>
  <h1>Runs Explorer</h1><p class="subt">Every run across every cycle, flat. Each one is a trace — open it to watch the data flow agent by agent, input to output. Shareable: <span class="mono">#/run/&lt;run-id&gt;</span> jumps straight to a flow.</p>
  <div class="cycles" style="margin-top:16px">${rows}</div>`;
}

function onSearch(v){const app=document.getElementById("app");const inp=document.getElementById("q");const pos=inp?inp.selectionStart:null;app.innerHTML=renderCycles(v);const q2=document.getElementById("q");if(q2){q2.focus();if(pos!=null)q2.setSelectionRange(pos,pos);}}
function route(){
  const h=location.hash||"#/";
  let out,m;
  if((m=h.match(/^#\/run\/([^/]+)(?:\/(.+))?$/))) out=renderRun(decodeURIComponent(m[1]),m[2]?decodeURIComponent(m[2]):null);
  else if((m=h.match(/^#\/cycle\/(.+)$/)))        out=renderCycle(decodeURIComponent(m[1]));
  else if(h==="#/runs")                           out=renderRuns();
  else                                            out=renderCycles("");
  document.getElementById("app").innerHTML=out;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script></body></html>
