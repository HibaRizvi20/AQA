<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="cache-control" content="no-cache"><title>AQA Runs Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   AQA Runs Explorer

   Warm, light, editorial. A QA board is read for a long time and shown to
   people who did not write the tests, so it is built like a document with
   real typographic hierarchy rather than a dense instrument panel.

   The one ornament is made of the run's own data: the pipeline ribbon on the
   explorer is twelve agents' actual states, not decoration.

   Type: Bricolage Grotesque for display, Inter Tight for interface,
   JetBrains Mono for anything that is data. Figures are tabular everywhere a
   person compares them.
   ───────────────────────────────────────────────────────────────────────── */

:root {
  /* a warm neutral, biased toward the accent rather than a dead grey */
  --bg:        #FBF7F4;
  --bg-tint:   #F6EFEA;
  --surface:   #FFFFFF;
  --surface-2: #FAF6F3;
  --sunk:      #F4EEE9;
  --border:    #EBE2DC;
  --border-2:  #DCD0C8;

  --ink:    #191411;
  --ink-2:  #3D342E;
  --muted:  #6B5F57;
  --faint:  #9A8D84;

  --accent:      #5B3DF5;
  --accent-ink:  #4A2FD6;
  --accent-soft: #EFEBFE;
  --accent-line: #D5CBFB;

  --ok:   #10794C;  --ok-soft:   #E7F5EE;  --ok-line:   #B5DECA;
  --fail: #C7304A;  --fail-soft: #FCEBEE;  --fail-line: #F2C2CB;
  --gate: #9A6512;  --gate-soft: #FBF1E0;  --gate-line: #E9D3AA;
  --run:  #2665D0;  --run-soft:  #E9F0FD;  --run-line:  #C2D6F7;
  --stub: #C3B7AE;  --stub-soft: #F4EEE9;

  --display: "Bricolage Grotesque", "Inter Tight", ui-sans-serif, system-ui, sans-serif;
  --sans:    "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r: 14px; --r-s: 10px; --r-xs: 7px;
  --shadow:   0 1px 2px rgba(60,40,28,.04), 0 12px 32px -14px rgba(60,40,28,.14);
  --shadow-2: 0 2px 6px rgba(60,40,28,.06), 0 24px 60px -20px rgba(60,40,28,.20);
  --ring: 0 0 0 3px rgba(91,61,245,.14);
}

/* the dark side is a re-checked swap, kept for reading beside a terminal */
:root[data-theme="dark"] {
  --bg:#0F0D11; --bg-tint:#151218; --surface:#171419; --surface-2:#1D1922; --sunk:#131016;
  --border:#282330; --border-2:#37303F;
  --ink:#F3EFEC; --ink-2:#D3CBC6; --muted:#9E948F; --faint:#6F6570;
  --accent:#9B85FF; --accent-ink:#B4A2FF; --accent-soft:#211B36; --accent-line:#3E3363;
  --ok:#4ED18F; --ok-soft:#0F2A1E; --ok-line:#215239;
  --fail:#FF7386; --fail-soft:#2D1419; --fail-line:#5E2831;
  --gate:#EAB25E; --gate-soft:#2B2013; --gate-line:#584220;
  --run:#6BA5FF; --run-soft:#111F35; --run-line:#24426D;
  --stub:#4E4657; --stub-soft:#1A161F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.6);
  --shadow-2:0 2px 8px rgba(0,0,0,.45), 0 28px 64px -24px rgba(0,0,0,.7);
  --ring:0 0 0 3px rgba(155,133,255,.22);
}

* { box-sizing: border-box }
html { color-scheme: light dark }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(900px 520px at 88% -6%,  rgba(255,178,120,.20), transparent 62%),
    radial-gradient(760px 460px at 4%  -2%,  rgba(139,110,255,.16), transparent 60%),
    linear-gradient(180deg, var(--bg-tint) 0%, var(--bg) 34%);
  background-attachment: fixed;
}
:root[data-theme="dark"] body {
  background:
    radial-gradient(900px 520px at 88% -6%, rgba(255,140,90,.10), transparent 62%),
    radial-gradient(760px 460px at 4%  -2%, rgba(139,110,255,.14), transparent 60%),
    linear-gradient(180deg, var(--bg-tint) 0%, var(--bg) 34%);
}

.wrap { max-width: 1180px; margin: 0 auto; padding: 44px 28px 120px }
@media (max-width: 720px) { .wrap { padding: 26px 16px 72px } }

/* ── headings ─────────────────────────────────────────── */
.eyebrow {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 16px;
}
h1 {
  font-family: var(--display);
  font-size: clamp(38px, 6vw, 62px); line-height: .98;
  letter-spacing: -.035em; font-weight: 600; margin: 0 0 18px;
  text-wrap: balance; max-width: 18ch;
}
.subt { color: var(--muted); font-size: 16px; margin: 0; max-width: 62ch; line-height: 1.65 }

/* ── breadcrumb ───────────────────────────────────────── */
.crumb { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-bottom: 26px; letter-spacing: .02em }
.crumb button { background: none; border: none; padding: 3px 0; cursor: pointer; font: inherit; color: var(--muted); border-bottom: 1px solid transparent; transition: color .14s, border-color .14s }
.crumb button:hover { color: var(--accent-ink); border-bottom-color: var(--accent-line) }
.crumb .sep { opacity: .35 }

/* ── search ───────────────────────────────────────────── */
.search { display: flex; gap: 14px; align-items: center; margin: 30px 0 6px }
.search input {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 14px 22px; font: inherit; font-size: 14.5px;
  color: var(--ink); transition: border-color .14s, box-shadow .14s; box-shadow: var(--shadow);
}
.search input::placeholder { color: var(--faint) }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring) }
.count { font-family: var(--mono); font-size: 11.5px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums }

/* ── pills ────────────────────────────────────────────── */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .04em;
  padding: 4px 11px; border-radius: 999px;
  background: var(--stub-soft); color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
}
.pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor }
.pill.ok    { background: var(--ok-soft);   color: var(--ok);   border-color: var(--ok-line) }
.pill.fail  { background: var(--fail-soft); color: var(--fail); border-color: var(--fail-line) }
.pill.gate  { background: var(--gate-soft); color: var(--gate); border-color: var(--gate-line) }
.pill.run   { background: var(--run-soft);  color: var(--run);  border-color: var(--run-line) }
.pill.muted { background: var(--stub-soft); color: var(--faint) }

.empty { color: var(--faint); font-size: 14px; text-align: center; padding: 56px }
.back { display: inline-flex; gap: 7px; align-items: center; background: none; border: none; color: var(--accent-ink); font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; padding: 8px 0 }
.back:hover { text-decoration: underline; text-underline-offset: 4px }

/* ── milestone band ───────────────────────────────────── */
.ms { margin-top: 52px }
.ms-h { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: baseline; padding-bottom: 14px; border-bottom: 1px solid var(--border) }
.ms-t { font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: -.028em; background: none; border: none; padding: 0; cursor: pointer; color: var(--ink) }
.ms-t:hover { color: var(--accent-ink) }
.ms-m { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: .02em }
.ms-m b { color: var(--muted); font-weight: 500 }
.cov { display: flex; align-items: center; gap: 10px; margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .16em }
.covbar { width: 130px; height: 6px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--border); overflow: hidden }
.covbar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FF9A5A, var(--accent)) }

/* ── cycle cards ──────────────────────────────────────── */
.cycles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; margin-top: 22px }
.cyc {
  position: relative; overflow: hidden; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r);
  padding: 24px 26px; cursor: pointer; text-align: left; width: 100%;
  font: inherit; color: inherit; display: flex; flex-direction: column; gap: 16px;
  box-shadow: var(--shadow); transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s;
}
.cyc::after {
  content: ""; position: absolute; inset: auto -30% -60% auto; width: 240px; height: 240px;
  background: radial-gradient(circle, rgba(255,154,90,.16), transparent 68%);
  pointer-events: none; opacity: 0; transition: opacity .25s;
}
.cyc:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--border-2) }
.cyc:hover::after { opacity: 1 }
.cyc:focus-visible { outline: none; box-shadow: var(--ring) }
.cyc-top { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between }
.cyc-id { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: .12em; text-transform: uppercase }
.cyc-n { font-family: var(--display); font-weight: 600; font-size: 25px; letter-spacing: -.03em; margin-top: 8px; line-height: 1.1 }
.cyc-m { color: var(--muted); font-size: 12.5px; margin-top: 7px; font-family: var(--mono) }
.cyc-row { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 12px; color: var(--faint); border-top: 1px solid var(--border); padding-top: 14px; font-variant-numeric: tabular-nums }
.cyc-row b { font-family: var(--mono); font-size: 15px; color: var(--ink); font-weight: 600; letter-spacing: -.02em }

/* the pipeline ribbon: twelve agents, their real states */
.agbar { display: flex; gap: 3px; height: 22px; align-items: flex-end }
.agbar i {
  flex: 1; height: 8px; border-radius: 999px; background: var(--stub-soft);
  border: 1px solid var(--border); transition: height .2s cubic-bezier(.2,.7,.3,1);
}
.cyc:hover .agbar i { height: 14px }
.agbar i.ok   { background: linear-gradient(180deg, var(--accent), #7B5BFF); border-color: transparent }
.agbar i.gate { background: linear-gradient(180deg, #FFB55A, var(--gate)); border-color: transparent }
.agbar i.na   { background: var(--stub); border-color: transparent; opacity: .4 }

.vbar { display: flex; height: 7px; border-radius: 999px; overflow: hidden; background: var(--sunk); border: 1px solid var(--border) }
.vbar span { height: 100% }
.vbar .p { background: var(--ok) } .vbar .f { background: var(--fail) }
.vbar .b { background: var(--gate) } .vbar .n { background: var(--stub); opacity: .45 }

/* ── stat tiles ───────────────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin: 34px 0 8px }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px 24px; box-shadow: var(--shadow) }
.tile .n { font-family: var(--display); font-size: 42px; font-weight: 600; letter-spacing: -.045em; font-variant-numeric: tabular-nums; line-height: 1 }
.tile .l { font-family: var(--mono); font-size: 9.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .2em; margin-top: 12px }
.tile .s { font-size: 12.5px; color: var(--muted); margin-top: 6px }

.dhead { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin: 6px 0 10px }
.dhead h2 { font-family: var(--display); font-size: clamp(28px, 4vw, 40px); margin: 0; letter-spacing: -.035em; font-weight: 600; line-height: 1.05; text-wrap: balance }
.kv { font-family: var(--mono); font-size: 11.5px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; letter-spacing: .02em }
.kv b { color: var(--ink-2); font-weight: 500 }

.sec { margin-top: 52px }
.sec h3 { font-family: var(--display); font-size: 24px; margin: 0 0 6px; letter-spacing: -.028em; font-weight: 600 }
.sec .h-sub { font-size: 14px; color: var(--muted); margin: 0 0 18px; max-width: 68ch }

/* ── filters ──────────────────────────────────────────── */
.filters { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; margin: 20px 0; box-shadow: var(--shadow) }
.frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 }
.flab { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); width: 60px; flex: none }
.fchip {
  font-family: var(--mono); font-size: 11.5px; background: var(--sunk);
  border: 1px solid transparent; border-radius: 999px; padding: 6px 14px;
  color: var(--muted); cursor: pointer; transition: all .14s;
}
.fchip:hover { background: var(--surface); border-color: var(--border-2); color: var(--ink-2) }
.fchip.on { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.fchip .c { opacity: .55; margin-left: 6px; font-variant-numeric: tabular-nums }

/* ── tables ───────────────────────────────────────────── */
.tw { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow) }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px }
th {
  text-align: left; padding: 14px 20px; border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .2em;
  color: var(--faint); background: var(--surface-2); white-space: nowrap; font-weight: 500;
}
td { padding: 17px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; font-variant-numeric: tabular-nums }
tr:last-child td { border-bottom: none }
tr.clk { cursor: pointer; transition: background .12s }
tr.clk:hover td { background: var(--surface-2) }
tr.clk:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent) }

.mono { font-family: var(--mono); font-size: 12.5px }
.cid { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--accent-ink); white-space: nowrap; letter-spacing: .02em }
.arrowc { color: var(--faint); text-align: right; white-space: nowrap; font-size: 12px }
tr.clk:hover .arrowc { color: var(--accent-ink) }

.chip { font-family: var(--mono); font-size: 10.5px; background: var(--sunk); border: 1px solid transparent; border-radius: 999px; padding: 3px 10px; color: var(--muted); display: inline-block; margin: 1px 4px 1px 0; white-space: nowrap }
.chip.ty { background: var(--accent-soft); color: var(--accent-ink) }
.chip.ly { background: var(--run-soft); color: var(--run) }

/* ── trace layout ─────────────────────────────────────── */
.layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 32px; align-items: start; margin-top: 30px }
.layout > * { min-width: 0 }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; gap: 20px } }

.nav { position: sticky; top: 22px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 44px); overflow-y: auto; min-width: 0; padding-right: 6px }
.nav::-webkit-scrollbar { width: 5px } .nav::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px }
.nav-item {
  display: flex; align-items: center; gap: 11px; text-align: left; background: transparent;
  border: 1px solid transparent; border-radius: 999px; padding: 9px 14px; cursor: pointer;
  color: var(--muted); font: inherit; font-size: 13px; transition: background .12s, color .12s;
}
.nav-item:hover { background: var(--surface); color: var(--ink-2) }
.nav-item.active { background: var(--ink); color: var(--bg) }
.nav-item.active .ni-n, .nav-item.active .ni-dot { color: var(--bg); opacity: .7 }
.ni-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--stub); flex: none; opacity: .5 }
.ni-dot.ok { background: var(--ok); opacity: 1 } .ni-dot.gate { background: var(--gate); opacity: 1 } .ni-dot.fail { background: var(--fail); opacity: 1 }
.ni-n { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 14px; flex: none; font-variant-numeric: tabular-nums }
.ni-a { font-weight: 500; flex: 1; line-height: 1.3; min-width: 0; overflow-wrap: anywhere }
.nav-item.active .ni-a { font-weight: 600 }
.ni-g { font-family: var(--mono); font-size: 8.5px; font-weight: 600; padding: 2px 6px; border-radius: 999px; background: var(--gate-soft); color: var(--gate) }
.ni-g.ok { background: var(--ok-soft); color: var(--ok) }
.nav-item.active .ni-g { background: rgba(255,255,255,.16); color: var(--bg) }
.nav-lbl { font-family: var(--mono); font-size: 8.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); margin: 26px 0 10px; padding-left: 14px }
.nav-lbl:first-child { margin-top: 0 }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 34px 38px; box-shadow: var(--shadow) }
@media (max-width: 720px) { .panel { padding: 22px 20px } }
.p-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap }
.p-head h3 { font-family: var(--display); font-size: 30px; margin: 0; letter-spacing: -.032em; font-weight: 600 }
.p-id { color: var(--faint); font-size: 11px; font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase }

/* ── agent brief ──────────────────────────────────────── */
.brief { border: 1px solid var(--border); border-radius: var(--r-s); background: var(--surface-2); padding: 24px 26px; margin: 22px 0 26px }
.brief-h { font-family: var(--mono); font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px }
.brief-does { font-size: 17px; line-height: 1.55; margin: 0 0 22px; color: var(--ink); letter-spacing: -.012em; max-width: 62ch }
.brief-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; border-top: 1px solid var(--border); padding-top: 20px }
.brief-cell .k { font-family: var(--mono); font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 7px }
.brief-cell .v { font-size: 13px; line-height: 1.6; color: var(--muted) }
.brief-cell.never .k { color: var(--fail) }
.brief-cell .v .mono { color: var(--accent-ink); font-size: 12px }

/* ── expandable io ────────────────────────────────────── */
details.io { border: 1px solid var(--border); border-radius: var(--r-s); margin: 14px 0; overflow: hidden; background: var(--surface-2) }
details.io.out { background: linear-gradient(180deg, var(--accent-soft), var(--surface)); border-color: var(--accent-line) }
details.io > summary {
  list-style: none; cursor: pointer; padding: 16px 22px; display: flex; flex-wrap: wrap;
  gap: 10px; align-items: center; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .2em; text-transform: uppercase; color: var(--muted); user-select: none;
}
details.io > summary::-webkit-details-marker { display: none }
details.io > summary:hover { color: var(--ink) }
details.io > summary .tw-caret { font-size: 8px; color: var(--faint); transition: transform .16s; display: inline-block; width: 8px }
details.io[open] > summary .tw-caret { transform: rotate(90deg) }
details.io > summary .from {
  font-family: var(--mono); background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 13px; font-size: 10px; color: var(--accent-ink);
  cursor: pointer; letter-spacing: .04em; text-transform: none; transition: all .14s;
}
details.io > summary .from:hover { border-color: var(--accent); box-shadow: var(--ring) }
details.io > summary .peek { letter-spacing: .02em; text-transform: none; font-size: 11px; color: var(--faint); margin-left: auto }
details.io[open] > summary .peek { display: none }
.io-body { padding: 0 22px 22px }
.io-body p { font-size: 14.5px; margin: 10px 0; color: var(--ink-2) }

details.raw { border: 1px solid var(--border); border-radius: var(--r-xs); background: var(--sunk); margin-top: 16px; overflow: hidden }
details.raw > summary { list-style: none; cursor: pointer; padding: 10px 14px; font-family: var(--mono); font-size: 9.5px; color: var(--faint); display: flex; gap: 9px; align-items: center; user-select: none; letter-spacing: .16em; text-transform: uppercase }
details.raw > summary::-webkit-details-marker { display: none }
details.raw > summary:hover { color: var(--accent-ink) }
details.raw > summary .tw-caret { font-size: 8px; transition: transform .16s; display: inline-block; width: 8px }
details.raw[open] > summary .tw-caret { transform: rotate(90deg) }
details.raw pre { margin: 0; border: none; border-top: 1px solid var(--border); border-radius: 0; background: transparent; font-size: 11.5px; max-height: 400px; overflow: auto }

.arrow { text-align: center; font-size: 12px; color: var(--faint); margin: 6px 0; opacity: .5 }

.stepnav { display: flex; justify-content: space-between; gap: 14px; margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--border) }
.stepnav button {

}

/* ── code ─────────────────────────────────────────────── */
pre { font-family: var(--mono); font-size: 12px; line-height: 1.75; background: var(--sunk); border: 1px solid var(--border); border-radius: var(--r-xs); padding: 18px 20px; overflow-x: auto; white-space: pre-wrap; margin: 12px 0; color: var(--ink-2) }
pre::-webkit-scrollbar { height: 5px } pre::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px }

.legend { display: flex; flex-wrap: wrap; gap: 24px; font-size: 12.5px; color: var(--muted); margin-top: 34px }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 8px }
.dot.ok { background: var(--ok) } .dot.gate { background: var(--gate) } .dot.stub { background: var(--stub) } .dot.fail { background: var(--fail) }

ol, ul { margin: 12px 0; padding-left: 22px } li { margin: 7px 0; font-size: 13.5px; color: var(--ink-2) }

.banner { border: 1px solid var(--accent-line); border-left-width: 3px; background: var(--accent-soft); padding: 16px 20px; border-radius: var(--r-xs); font-size: 13.5px; margin: 18px 0; color: var(--ink-2) }
.banner.warn { border-color: var(--gate-line); border-left-color: var(--gate); background: var(--gate-soft) }
.banner.bad  { border-color: var(--fail-line); border-left-color: var(--fail); background: var(--fail-soft) }

.provenance {

}

.provenance .dotline { width: 6px; height: 6px; border-radius: 999px; background: var(--ok); flex: none; box-shadow: 0 0 0 3px var(--ok-soft) }
.provenance.is-example .dotline { background: var(--gate); box-shadow: 0 0 0 3px var(--gate-soft) }

.foot { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--faint) }

#themeToggle {
  position: fixed; top: 26px; right: 26px; z-index: 20; width: 42px; height: 42px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1;
  display: grid; place-items: center; box-shadow: var(--shadow); transition: all .16s;
}
#themeToggle:hover { color: var(--accent-ink); border-color: var(--accent-line); transform: translateY(-1px) }
@media (max-width: 720px) { #themeToggle { top: 12px; right: 12px; width: 36px; height: 36px } }

::selection { background: var(--accent-line); color: var(--ink) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

</head><body>
<button id="themeToggle" type="button" aria-label="Switch between dark and light" title="Theme"></button>
<div class="wrap" id="app"></div>
<script src="data.js" onerror="window.__AQA_NO_DATA=1"></script>
<script>
/* ═════════════════════════════════════════════════════════════════════════
   AQA · Runs Explorer
   Four levels:  milestone → cycle → test → agent trace.
   The trace is PER TEST: each agent shows what it received from the agent
   before it, and what it passed to the agent after it, for that one test.
   ═════════════════════════════════════════════════════════════════════════ */

/* 8 gated agents (1-8) behind five human gates, plus 4 async tracks (9-12)
   that report and never block a merge. Pre-flight, Targeted Run and
   Regression are execution phases, not agents, so they carry no number. */
const PHASES=[
 {id:"00-preflight",    a:"Pre-flight",         kind:"check"},
 {id:"01-scope",        a:"Scope Analyst",      kind:"agent", n:1},
 {id:"02-architecture", a:"Test Architect",     kind:"agent", n:2, gate:"CP1"},
 {id:"03-case-design",  a:"Case Designer",      kind:"agent", n:3, gate:"CP2"},
 {id:"3b-publish",      a:"Tracker Publisher",  kind:"agent", n:4},
 {id:"04-generate",     a:"Test Generator",     kind:"agent", n:5, gate:"CP3"},
 {id:"05-targeted-run", a:"Targeted Run",       kind:"run",         gate:"CP4"},
 {id:"06-self-heal",    a:"Triage / Self-Heal", kind:"agent", n:6},
 {id:"07-regression",   a:"Regression",         kind:"run"},
 {id:"08-review",       a:"Reviewer",           kind:"agent", n:7, gate:"CP5"},
 {id:"09-finalise",     a:"KB Curator",         kind:"agent", n:8},
];
const ASYNC=[
 {id:"a09-performance",   a:"Performance & Logs", kind:"async", n:9},
 {id:"a10-design-parity", a:"Design Parity",      kind:"async", n:10},
 {id:"a11-ai-eval",       a:"AI Eval Analyst",    kind:"async", n:11},
 {id:"a12-drift",         a:"Drift Detector",     kind:"async", n:12},
];
const ALL=[...PHASES,...ASYNC];
const byId=id=>ALL.find(p=>p.id===id);
const prevPhase=id=>{const i=PHASES.findIndex(p=>p.id===id);return i>0?PHASES[i-1]:null;};
const nextPhase=id=>{const i=PHASES.findIndex(p=>p.id===id);return i>=0&&i<PHASES.length-1?PHASES[i+1]:null;};


/* ── what each agent is FOR ──────────────────────────────────────────────
   Taken from the agent definitions in agents/*.md, including their explicit
   "You do NOT" clauses — the narrow remit is the design, not an omission.
   ──────────────────────────────────────────────────────────────────────── */
const AGENT_INFO={
"00-preflight":{
 does:"Checks the prerequisites, then reconciles the written intent against every place it is written down — tracker, docs, spec — and probes the <b>running app</b> for the controls this flow needs.",
 solves:"Intent drifts. The epic, the runbook and the app rarely agree, and nobody notices until a test fails for the wrong reason. Pre-flight surfaces the disagreement before a single case is written.",
 never:"Resolve a disagreement itself, or invent a selector for something it could not find.",
 out:"a probe report + surfaced conflicts"},
"01-scope":{
 does:"Takes one scope link — a tracker epic, a doc, or a repo path — traverses it, and sorts every item into exactly one bucket: <b>in scope</b>, <b>deferred</b>, or <b>out of scope</b>. Emits a 0–1 confidence with a one-line rationale.",
 solves:"Deciding what is worth testing is the judgement call that sets the cost of the whole cycle. Done by hand it drifts with whoever is doing it; done here every item lands in one bucket with a written reason, and low confidence forces an early human review instead of a bad plan.",
 never:"Write tests, plans or scenarios; touch the tracker; or resolve intent-vs-app disagreements — those go to CP1.",
 out:"<span class='mono'>artifacts/01-scope.json</span>"},
"02-architecture":{
 does:"Turns the classified scope into a <b>test plan</b>: routes each item to a track (UI, API, performance, pipeline), states one testable objective per item, plans the positive / negative / edge split, and names the risks.",
 solves:"Cases written without a plan cluster on the happy path. Planning the split first is what makes the negative and edge coverage deliberate rather than whatever came to mind. On a large scope it proposes a <b>pilot</b> — the smallest well-understood area to prove the approach before spending the rest.",
 never:"Write cases or scenarios, or touch code or the tracker.",
 out:"<span class='mono'>artifacts/02-architecture.json</span> → gate CP1"},
"03-case-design":{
 does:"Writes each objective as a stakeholder-readable Gherkin scenario — Given / When / Then, plain language, observable outcomes — co-located with its future step file and prefixed with its tracker key.",
 solves:"A test case and a spec are usually two documents that drift apart. A tagged scenario is both at once: a business reader can check it, and a runner can execute it. Every scenario is tagged <span class='mono'>@area</span> + <span class='mono'>@type</span> so any slice — one feature, all the negatives — is pickable by tag rather than by hand.",
 never:"Write step definitions, verify selectors live, or create tickets.",
 out:"<span class='mono'>artifacts/03-cases.json</span> + <span class='mono'>.feature</span> files → gate CP2"},
"3b-publish":{
 does:"Turns approved scenarios into test-case tickets in whatever tracker is configured. When / And become Steps, Then becomes Expected, and the summary carries the key.",
 solves:"Getting cases into the tracker is the tedious copy-paste that gets skipped under pressure, which is how a suite loses its traceability. It is <b>dry-run by default</b>: the exact payload is emitted and the agent stops. Nothing is created until a human confirms — so a bad plan cannot pollute a real tracker.",
 never:"Design or edit scenarios, write code, or merge.",
 out:"<span class='mono'>artifacts/3b-publish.json</span> · sent = 0 in dry-run"},
"04-generate":{
 does:"Writes the step definitions that make each Gherkin step actually run, mapping every Given / When / Then to a real page-object call, then compiles the specs.",
 solves:"This is the long pole, and the place where generated tests usually lie. Every selector is <b>verified against the running app</b> before it is trusted; if an element is absent the agent emits a dated skip naming the blocking ticket rather than guessing a selector that will fail later for an unrelated reason.",
 never:"Edit shared page objects, self-heal, or merge. New selectors go inline with a fixed annotation.",
 out:"<span class='mono'>.steps.ts</span> + <span class='mono'>artifacts/04-generate.json</span> → gate CP3"},
"05-targeted-run":{
 does:"Runs only the specs this cycle produced, against the live app — not the whole suite.",
 solves:"Running everything to learn about the few you just wrote wastes the feedback loop. This is the narrow run that tells you whether the new work stands up, before regression tells you whether it broke anything else.",
 never:"Fix anything. A failure here is evidence, handed to Triage.",
 out:"a per-spec result with evidence → gate CP4"},
"06-self-heal":{
 does:"Classifies every failure into one of three buckets — <b>known-flaky</b>, <b>test defect</b>, or <b>product bug</b> — then fixes only the test defects, in at most 3 cycles.",
 solves:"The expensive mistake in QA is filing a test's own bug against the product. That burns a developer's morning and erodes trust in the suite. Classifying first means a stale selector gets fixed and a real defect gets raised with evidence. The cap of 3 cycles exists so it cannot grind, and it will <b>never weaken a test to force green</b> — after 3 tries it stops and reclassifies.",
 never:"Design cases, run full regression, review, or merge.",
 out:"<span class='mono'>artifacts/06-self-heal.json</span>"},
"07-regression":{
 does:"Runs the whole suite, to prove this cycle's work did not break anything already covered.",
 solves:"A green new test says nothing about the ninety that existed before it. This is the step that earns the merge.",
 never:"Fix or triage. Failures go back to Triage.",
 out:"a full-suite result"},
"08-review":{
 does:"Reviews the generated tests the way a person reviews a pull request, against <span class='mono'>conventions.md</span>: tracker key present, tags present, page-object freeze respected, no bare 2xx assertion, selectors live-verified.",
 solves:"Generated code passes tests long before it is code you would want to maintain. This is the checklist that keeps a suite readable a year later — and an untagged scenario is a <b>blocking</b> finding, because an untagged test cannot be picked by anyone.",
 never:"Merge, or fix its own findings — Triage owns fixes.",
 out:"<span class='mono'>artifacts/08-review.json</span> + a dry-run PR comment → gate CP5"},
"09-finalise":{
 does:"Maintains the <b>Feature Registry</b> — a git-versioned knowledge base, one file per feature, recording <span class='mono'>intent</span> (where it is specified), <span class='mono'>truth</span> (routes and endpoints in the live app), <span class='mono'>ours</span> (which tests cover it) and when it was last verified against the running app.",
 solves:"Test coverage is normally invisible: nobody can answer \"what do we actually cover, and is it still true?\" without reading the suite. The registry answers both, in git, and its freshness date is what the Drift Detector re-checks later.",
 never:"Decide scope, write tests, or send anything external.",
 out:"<span class='mono'>kb/&lt;feature&gt;.yaml</span> + a coverage delta"},
"a09-performance":{
 does:"Pulls run history and per-step durations, summarises where the time goes and how it scales, and correlates with logs when a run looks anomalous.",
 solves:"Performance arguments stall on whether a number is bad. Budgets are declared <i>before</i> the run, so a breach is a fact rather than an opinion — and a bug is raised only on a clear breach, with evidence.",
 never:"Gate or block a merge, or file known non-determinism as a bug. Runtime is driven by load × iterations, not one dimension alone.",
 out:"<span class='mono'>out/performance-&lt;date&gt;.json</span> · report-only"},
"a10-design-parity":{
 does:"Drives a design prototype and the live app through the same route and state, captures them side by side, and compares across visual/layout, flow, copy, and states — empty, error, loading.",
 solves:"Design review happens once, before the build, and then reality drifts. This makes the prototype a testable artefact rather than a picture, and routes what it finds to the <b>design team</b> — a copy change or a wrong empty state is not a product bug and should not sit in a developer's queue.",
 never:"File product bugs, block the functional pipeline, or treat every pixel diff as a defect. A human triages regression versus deliberate evolution.",
 out:"<span class='mono'>out/design-parity-&lt;date&gt;.json</span> · non-blocking"},
"a11-ai-eval":{
 does:"Scores an AI assistant against a human-approved answer key. Per case it asks, fetches the trace — the answer, every tool call with args and result, span statuses, latency — then scores twice: LLM-as-judge on correctness, faithfulness, coherence and relevance, plus deterministic checks (expected tools present, no forbidden tools, no errored spans, latency inside budget).",
 solves:"An AI feature cannot be tested with pass/fail assertions; the same question has many acceptable answers. Quality is a <b>score against a baseline</b>, and the regression is the thing worth alerting on. Connect whichever tracer the organisation already runs — LangGraph, Phoenix, LangSmith, or anything OpenTelemetry-compatible.",
 never:"Gate a merge, edit the assistant, author ground truth unilaterally, or fabricate a trace or score. A low score is surfaced, never auto-filed as a product bug.",
 out:"<span class='mono'>out/ai-evals-&lt;date&gt;.json</span> · non-blocking"},
"a12-drift":{
 does:"On an app change or a deploy, re-verifies each Feature Registry anchor — routes, API shapes, DOM anchors — against the <b>live app</b>, and stamps the entry fresh only when the re-check actually passes.",
 solves:"A knowledge base that is never re-checked becomes confidently wrong, which is worse than having none. This is what keeps \"what we cover\" honest as the app moves underneath it. What it cannot verify, it reports as unchecked <i>with the reason</i> rather than stamping fresh.",
 never:"Write tests, edit page objects, or raise a product bug itself. It flags; a human decides whether it is a product bug or a stale registry.",
 out:"<span class='mono'>out/drift-&lt;date&gt;.json</span> · non-blocking"},
};

/* ── raw artifact payloads ───────────────────────────────────────────────
   An agent's INPUT payload IS the previous agent's OUTPUT payload — the
   chain is not described, it is the same object handed along. Async tracks
   are fed by their own trigger, so they carry their own config instead.
   ──────────────────────────────────────────────────────────────────────── */
const notRun=t=>({status:"not_reached", reason:"cycle paused at a human gate", gate:(CYCLES.find(c=>c.id===t.cycle)||{}).awaiting||null});
const reached=(t,id)=>(t.reached||[]).includes(id);

const OUT_JSON={
"00-preflight":t=>({
  scope_link:t.spec.ref||null, deps:"ok", app_reachable:true,
  sources:(t.sources||[]).map(x=>({source:x.from, agrees:!!x.agrees, conflict:x.conflict||null})),
  elements:(t.probe||[]).map(x=>({looked_for:x.what, found:x.found===null?"ambiguous":x.found, evidence:x.evidence})),
  findings:t.probeTitle?[{id:(t.probeTitle.split(" ")[0]||"PRE-01"), severity:t.probeSev==="bad"?"blocking":"info"}]:[]}),
"01-scope":t=>({
  in_scope:t.scope.in?[{behaviour:t.title, area:t.area}]:[],
  deferred:t.scope.in?[]:[{behaviour:t.title, why:t.scope.why}],
  out_scope:[], confidence:Number(t.scope.confidence),
  rationale:t.scope.why,
  findings:t.scope.finding?[{id:t.scope.finding.id, blocking:true}]:[]}),
"02-architecture":t=>({
  objectives:[{objective:t.objective, track:t.layer, type:t.type, area:t.area}],
  pilot:(CYCLES.find(c=>c.id===t.cycle)||{}).name||null,
  risks:t.scope.finding?[t.scope.finding.id+" — selector not uniquely addressable"]:[]}),
"03-case-design":t=>({
  features:1, scenarios:1,
  file:t.gherkin?"tests/features/"+t.area.replace(/ /g,"-")+".feature":null,
  scenario:{key:t.id, title:t.title, expected:t.expected||t.objective},
  tags:["@area:"+t.area,"@type:"+t.type].concat(t.layer?["@layer:"+t.layer]:[]),
  findings:t.tagNote?[{id:"TAG-01", note:"scenario tagged "+t.type+" by intent but stamped lifecycle by the engine"}]:[]}),
"3b-publish":t=>reached(t,"3b-publish")?({
  sent:0, dry_run:true,
  writes_pending:[{endpoint:"${TRACKER_BASE_URL}/api/testcases",
    payload:{summary:t.id+" "+t.title, labels:["area:"+t.area,"type:"+t.type,"aqa-generated"], expected:t.expected||t.objective}}]}):notRun(t),
"04-generate":t=>reached(t,"04-generate")?({
  step_defs:1, selectors_verified:(t.probe||[]).filter(x=>x.found===true).length, new_page_objects:0,
  files:["tests/features/"+t.area.replace(/ /g,"-")+".steps.ts"]}):notRun(t),
"05-targeted-run":t=>t.exec?({
  ran:1, passed:VER(t.verdict)==="p"?1:0, failed:VER(t.verdict)==="f"?1:0,
  duration:t.duration||null, command:t.exec.cmd,
  steps:t.exec.steps.map(x=>({step:x[0], observed:x[1]})),
  verdict:t.verdict, executed_by:t.source==="manual"?"human":"agent"}):notRun(t),
"06-self-heal":t=>reached(t,"06-self-heal")?({
  failures:t.heal?1:0, healed:t.heal?1:0, bugs_staged:0, known_flaky_skipped:0,
  classification:t.heal?"test_defect":"none", cycles_used:t.heal?1:0, cap:3}):notRun(t),
"07-regression":t=>reached(t,"07-regression")?({total:140, passed:140, skipped:0}):notRun(t),
"08-review":t=>reached(t,"08-review")?({findings:t.review?(t.review.match(/<li>/g)||[]).length:0, blocking:0}):notRun(t),
"09-finalise":t=>reached(t,"09-finalise")?({kb_file:"kb/"+t.area.replace(/ /g,"-")+".yaml", coverage:"covered", verified_against_live:(CYCLES.find(c=>c.id===t.cycle)||{}).ended||null}):notRun(t),
"a09-performance":t=>t.perf?({agent:"performance-analyst", track:"async · non-blocking", gates:false,
  steps:t.perf.rows.map(r=>({step:r[0], n:Number(r[1]), p50:Number(r[2]), p95:Number(r[3]), budget:Number(r[4]), breach:r[5]})),
  findings:t.perf.rows.filter(r=>r[5]).map(r=>({id:"PERF-"+r[0], severity:"medium", evidence:"p95 "+r[2+1]+"ms over declared budget "+r[4]+"ms"}))
  }):({status:"not_configured", reason:"no budget declared for the steps this flow touches", gates:false}),
"a10-design-parity":t=>t.parity?({agent:"design-parity-analyst", diffs:[]}):({status:"not_configured", reason:"no prototype source connected for this target", gates:false, note:"reported as not-run, never as a pass"}),
"a11-ai-eval":t=>t.aieval?({agent:"eval-analyst", scores:[]}):({status:"not_applicable", reason:"this flow has no AI assistant and no trace source", gates:false, note:"skipped honestly rather than reported as passing"}),
"a12-drift":t=>t.drift?({agent:"drift-detector", track:"async · non-blocking",
  checked:t.drift.rows.length,
  verified:t.drift.rows.filter(r=>r[1]==="verified").length,
  drifted:t.drift.rows.filter(r=>r[1]==="drifted").length,
  not_checked:t.drift.rows.filter(r=>r[1]==="not-checked").length,
  checks:t.drift.rows.map(r=>({anchor:r[0], status:r[1], evidence:r[2]}))
  }):({status:"not_configured", reason:"no registry entry recorded for this flow yet", gates:false}),
};
function outJson(t,id){try{const f=OUT_JSON[id];return f?f(t):null;}catch(e){return null;}}
function inJson(t,id){
  const p=byId(id);
  if(p&&p.kind==="async"){
    if(id==="a09-performance")   return t.perf?{trigger:"scheduled", budgets_declared:t.perf.budgets.split("\n")}:{trigger:"scheduled", budgets_declared:[]};
    if(id==="a12-drift")         return t.drift?{trigger:"app change or deploy", registry_anchors:t.drift.anchors.split("\n")}:{trigger:"app change or deploy", registry_anchors:[]};
    if(id==="a10-design-parity") return {trigger:"manual", prototype_source:null, live_app:(CYCLES.find(c=>c.id===t.cycle)||{}).target||null};
    return {trigger:"manual", golden_dataset:null, trace_endpoint:null};
  }
  const prev=prevPhase(id);
  if(!prev) return {scope_link:t.spec.ref||null, source:t.spec.source, spec:t.spec.text};
  return outJson(t,prev.id);
}


/* ── traces from real artifacts ───────────────────────────────────────────
   When a run has been exported, a trace panel is rendered from the artifact the
   phase actually wrote, sliced to the test you clicked. The hand-authored
   builders below are only for the bundled example; pointing them at exported
   data was reading fields that a real artifact does not have. */
function liveArtifact(test, phaseId) {
  const byRun = (LIVE && LIVE.traces && LIVE.traces[test.cycle]) || null;
  const env = byRun && byRun[phaseId];
  return env ? (env.schema === "aqa.artifact" ? env.data : env) : null;
}

/** The part of a phase artifact that belongs to THIS test, when it has one. */
function sliceFor(phaseId, a, id) {
  if (!a) return null;
  const find = (arr) => (Array.isArray(arr) ? arr.find((x) => x.id === id) : null);
  switch (phaseId) {
    case "01-scope":        return find(a.in_scope) || find(a.deferred) || null;
    case "02-architecture": return find(a.objectives);
    case "03-case-design":  return find(a.cases);
    case "3b-publish":      return (a.writes_pending || []).find((w) => String(w.payload && w.payload.summary).startsWith(id)) || null;
    case "04-generate":     return find(a.runnable) || find(a.skipped) || null;
    case "05-targeted-run": return find(a.results);
    case "06-self-heal":    return find(a.triaged);
    case "07-regression":   return find(a.results);
    default:                return null;
  }
}

function kvTable(o) {
  if (!o || typeof o !== "object") return "";
  const rows = Object.entries(o)
    .filter(([, v]) => v !== null && v !== undefined && !(Array.isArray(v) && v.length === 0))
    .map(([k, v]) => {
      const val = Array.isArray(v)
        ? v.map((x) => `<div class="mono" style="margin:1px 0">${esc(typeof x === "object" ? JSON.stringify(x) : x)}</div>`).join("")
        : typeof v === "object"
          ? `<span class="mono">${esc(JSON.stringify(v))}</span>`
          : `<span class="mono">${esc(v)}</span>`;
      return `<tr><td style="white-space:nowrap;color:var(--muted)">${esc(k)}</td><td>${val}</td></tr>`;
    })
    .join("");
  return rows ? `<table><tbody>${rows}</tbody></table>` : "";
}

/** Headline sentence per phase, from the real artifact. */
function liveHeadline(phaseId, a, test) {
  if (!a) return "This phase produced no artifact in this run.";
  if (a.status === "not_configured" || a.status === "not_applicable")
    return `<div class="banner warn"><b>${esc(a.status.replace("_", " "))}</b>${esc(a.reason || "")}</div>`;
  switch (phaseId) {
    case "00-preflight":    return `<p>Probed <b>${(a.routes || []).length}</b> route(s); auth ${a.auth && a.auth.obtained ? "obtained" : "not obtained"}. <b>${(a.findings || []).length}</b> finding(s).</p>`;
    case "01-scope":        return `<p><b>${(a.in_scope || []).length}</b> in scope, <b>${(a.deferred || []).length}</b> deferred, confidence <b>${a.confidence}</b>. ${esc(a.rationale || "")}</p>`;
    case "02-architecture": return `<p><b>${(a.objectives || []).length}</b> objective(s). ${(a.risks || []).length ? "Risks: " + a.risks.map(esc).join("; ") : "No risks flagged."}</p>`;
    case "03-case-design":  return `<p><b>${a.scenarios}</b> scenario(s) in <span class="mono">${esc(a.file || "")}</span>; <b>${(a.untagged || []).length}</b> untagged.</p>`;
    case "3b-publish":      return `<p><b>${a.testcases}</b> payload(s) built. <span class="pill ${a.sent ? "" : "ok"}">sent = ${a.sent}</span>${a.dry_run ? " (dry-run)" : ""}</p>`;
    case "04-generate":     return `<p><b>${a.step_defs}</b> runnable, <b>${(a.skipped || []).length}</b> skipped with a reason.</p>`;
    case "05-targeted-run": return `<p><b>${a.ran}</b> ran · <b>${a.passed}</b> passed · <b>${a.failed}</b> failed · <b>${a.skipped}</b> skipped.</p>`;
    case "06-self-heal":    return `<p><b>${a.failures}</b> failure(s) · <b>${a.bugs_staged}</b> bug(s) staged · <b>${a.known_flaky_skipped}</b> environment.</p>`;
    case "07-regression":   return `<p><b>${a.passed}</b>/<b>${a.total}</b> passed.</p>`;
    case "08-review":       return `<p><b>${(a.findings || []).length}</b> finding(s) · <b>${a.blocking}</b> blocking.</p>`;
    case "09-finalise":     return `<p><span class="mono">${esc(a.file || "")}</span> · coverage <b>${esc((a.entry || {}).coverage || "—")}</b>${a.note ? `<br><span class="sub2">${esc(a.note)}</span>` : ""}</p>`;
    case "a09-performance": return `<p><b>${(a.steps || []).length}</b> step(s) measured · <b>${(a.findings || []).length}</b> breach(es).</p>`;
    case "a12-drift":       return `<p><b>${a.checked}</b> checked · <b>${a.verified}</b> verified · <b>${a.drifted}</b> drifted · <b>${a.not_checked}</b> unchecked.</p>`;
    default:                return `<p>Artifact produced.</p>`;
  }
}

function liveTrace(test, phaseId) {
  const a = liveArtifact(test, phaseId);
  const prev = prevPhase(phaseId);
  const prevA = prev ? liveArtifact(test, prev.id) : null;
  const mine = sliceFor(phaseId, a, test.id);
  const prevMine = prev ? sliceFor(prev.id, prevA, test.id) : null;

  const inHtml = prev
    ? (prevA
        ? `<p>What <b>${esc(prev.a)}</b> produced${prevMine ? ` for <span class="mono">${esc(test.id)}</span>` : ""}, handed straight over.</p>` +
          (prevMine ? kvTable(prevMine) : liveHeadline(prev.id, prevA, test))
        : `<p class="sub2">The previous phase produced no artifact in this run, so nothing was handed over.</p>`)
    : `<p>The written intent for this flow, and the running app it was probed against.</p>` +
      (a && a.app ? kvTable(a.app) : "");

  const outHtml = a
    ? liveHeadline(phaseId, a, test) +
      (mine ? `<div class="sub">For ${esc(test.id)}</div>${kvTable(mine)}` : "") +
      (phaseId === "05-targeted-run" && mine && mine.checks
        ? `<div class="sub">Checks</div><table><thead><tr><th>Check</th><th>Expected</th><th>Actual</th><th></th></tr></thead><tbody>${mine.checks
            .map((c) => `<tr><td>${esc(c.check)}</td><td class="mono">${esc(c.expected)}</td><td class="mono">${esc(c.actual)}</td><td>${c.ok ? '<span class="pill ok">ok</span>' : '<span class="pill fail">differs</span>'}</td></tr>`)
            .join("")}</tbody></table>`
        : "")
    : `<div class="banner warn"><b>Not reached in this run</b>No artifact was written for this phase.</div>`;

  return { in: inHtml, out: outHtml, inJson: prev ? prevA : (a && a.app) || null, outJson: a };
}

/* ── real data, when a run has been exported ──────────────────────────────
   `node pipeline/report.mjs` writes dashboard/data.js from artifacts the pipeline
   actually produced. Without it the board shows the bundled example and says so,
   rather than passing illustrative numbers off as a run. */
const LIVE = (typeof window !== "undefined" && window.AQA_DATA) ? window.AQA_DATA : null;
let LIVE_FINDINGS = {};
if (LIVE) {
  MILESTONES = LIVE.milestones;
  CYCLES = LIVE.cycles;
  TESTS = LIVE.tests;
  LIVE_FINDINGS = LIVE.findings ?? {};
}

/* ── helpers ────────────────────────────────────────────────────────────── */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const cyclesOf=m=>CYCLES.filter(c=>c.milestone===m.id);
const testsOf=c=>TESTS.filter(t=>t.cycle===c.id);
function agentState(c,agent){
  if((c.ran||[]).includes(agent.id))return "ok";
  if((c.na||[]).includes(agent.id))return "na";
  return c.awaiting&&agent.gate===c.awaiting?"gate":"pending";
}
function agentTally(c){
  const nums=ALL.filter(p=>p.n); let ok=0,na=0,pend=0;
  for(const a of nums){const s=agentState(c,a); s==="ok"?ok++:s==="na"?na++:pend++;}
  return {ok,na,pend,total:nums.length};
}
const VER=v=>/^pass/i.test(v)?"p":/^fail/i.test(v)?"f":/block|not/i.test(v)?"n":"b";
function verdictPill(v){
  const k=VER(v);
  return `<span class="pill ${k==="p"?"ok":k==="f"?"fail":k==="b"?"gate":"muted"}">${esc(v)}</span>`;
}
function statusPill(x){
  if(x.status==="complete")return '<span class="pill ok">complete</span>';
  if(x.status==="paused")return '<span class="pill gate">paused · awaiting '+esc(x.awaiting)+'</span>';
  if(x.status==="running")return '<span class="pill run">running</span>';
  return '<span class="pill">'+esc(x.status)+'</span>';
}
function coverage(c){
  const ts=testsOf(c); if(!ts.length)return 0;
  return Math.round(ts.filter(t=>VER(t.verdict)==="p").length/ts.length*100);
}
function verdictBar(ts){
  const n=ts.length||1, cnt={p:0,f:0,b:0,n:0};
  ts.forEach(t=>cnt[VER(t.verdict)]++);
  return `<div class="vbar">${["p","f","b","n"].map(k=>cnt[k]?`<span class="${k}" style="width:${cnt[k]/n*100}%"></span>`:"").join("")}</div>`;
}

/* ── LEVEL 1 · Runs Explorer: milestones, cycles, coverage, dates ───────── */
function renderExplorer(q){
  q=(q||"").trim().toLowerCase();
  const match=c=>!q||[c.id,c.name,c.kind,c.target,c.status,(MILESTONES.find(m=>m.id===c.milestone)||{}).name].join(" ").toLowerCase().includes(q);
  const allT=TESTS.length, passT=TESTS.filter(t=>VER(t.verdict)==="p").length;
  const openGates=CYCLES.filter(c=>c.awaiting).length;

  const blocks=MILESTONES.map(m=>{
    const cs=cyclesOf(m).filter(match); if(!cs.length)return "";
    const mt=cs.flatMap(testsOf);
    const cov=mt.length?Math.round(mt.filter(t=>VER(t.verdict)==="p").length/mt.length*100):0;
    const tiles=cs.map(c=>{
      const ts=testsOf(c), t=agentTally(c);
      const bars=ALL.filter(p=>p.n).map(a=>{const s=agentState(c,a);return `<i class="${s==="ok"?"ok":s==="na"?"na":s==="gate"?"gate":""}" title="${a.n}. ${esc(a.a)} — ${s}"></i>`;}).join("");
      return `<button class="cyc" onclick="go('#/cycle/${c.id}')">
        <div class="cyc-top"><div><div class="cyc-id">${esc(c.id)} · ${esc(c.kind)}</div><div class="cyc-n">${esc(c.name)}</div>
          <div class="cyc-m">${esc(c.target)}</div></div><div>${statusPill(c)}</div></div>
        ${verdictBar(ts)}
        <div class="cyc-row"><span><b>${ts.length}</b> tests</span><span><b>${coverage(c)}%</b> passing</span><span><b>${t.ok}</b>/${t.total} agents</span></div>
        <div class="agbar">${bars}</div>
        <div class="cyc-row" style="border:none;padding-top:2px"><span>${esc(c.started)} → ${esc(c.ended||"in progress")}</span></div>
      </button>`;
    }).join("");
    return `<section class="ms"><div class="ms-h">
      <button class="ms-t" onclick="go('#/milestone/${m.id}')">${esc(m.name)} →</button>
      <span class="ms-m"><b>${esc(m.id)}</b> · ${esc(m.window)} · ${cs.length} cycle${cs.length!==1?"s":""} · ${mt.length} tests</span>
      <span class="cov">coverage <div class="covbar"><i style="width:${cov}%"></i></div> <b style="font-family:var(--mono);color:var(--ink)">${cov}%</b></span>
    </div><div class="cycles">${tiles}</div></section>`;
  }).join("");

  const source = LIVE
    ? `<p class="provenance"><span class="dotline"></span>Showing <b>${LIVE.cycles.length} real run${LIVE.cycles.length === 1 ? "" : "s"}</b>, exported ${esc(String(LIVE.generatedAt).replace("T", " ").slice(0, 16))} from <span class="mono">pipeline/runs</span></p>`
    : `<p class="provenance is-example"><span class="dotline"></span>Showing the <b>bundled example</b>. Run the pipeline, then <span class="mono">node pipeline/report.mjs</span>, to replace this with your own runs</p>`;
  return `<p class="eyebrow">AQA · Autonomous QA</p><h1>Runs Explorer</h1>
  <p class="subt">Every milestone, the cycles inside it, and how far each one got. Open a cycle to see the individual tests it ran, then open a test to watch all 12 agents pass it hand to hand, input to output.</p>${source}
  <div class="tiles">
    <div class="tile"><div class="n">${MILESTONES.length}</div><div class="l">Milestones</div><div class="s">${CYCLES.length} cycles inside them</div></div>
    <div class="tile"><div class="n">${allT}</div><div class="l">Tests</div><div class="s">${passT} passing · ${allT-passT} not</div></div>
    <div class="tile"><div class="n">${allT?Math.round(passT/allT*100):0}%</div><div class="l">Coverage</div><div class="s">across every cycle</div></div>
    <div class="tile"><div class="n">${openGates}</div><div class="l">Open gates</div><div class="s">${openGates?"waiting on a human":"nothing waiting"}</div></div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Search milestones, cycles, targets…" value="${esc(q)}" oninput="onSearch(this.value)"><span class="count">${CYCLES.filter(match).length} / ${CYCLES.length} cycles</span></div>
  ${blocks||'<div class="empty">Nothing matches “'+esc(q)+'”.</div>'}
  <div class="legend" style="margin-top:20px"><span><i class="dot ok"></i>passed</span><span><i class="dot fail"></i>failed</span><span><i class="dot gate"></i>blocked / at a gate</span><span><i class="dot stub"></i>not run</span></div>`;
}

/* ── LEVEL 2 · one milestone ────────────────────────────────────────────── */
function renderMilestone(id){
  const m=MILESTONES.find(x=>x.id===id);
  if(!m)return `<button class="back" onclick="go('#/')">← Runs Explorer</button><div class="empty">Milestone <b>${esc(id)}</b> not found.</div>`;
  const cs=cyclesOf(m), ts=cs.flatMap(testsOf);
  const cov=ts.length?Math.round(ts.filter(t=>VER(t.verdict)==="p").length/ts.length*100):0;
  const rows=cs.map(c=>{
    const t=testsOf(c);
    return `<tr class="clk" onclick="go('#/cycle/${c.id}')"><td class="cid">${esc(c.id)}</td>
      <td>${esc(c.name)}<div class="cyc-m">${esc(c.target)}</div></td><td><span class="chip">${esc(c.kind)}</span></td>
      <td class="mono">${esc(c.started)}<div style="color:var(--faint)">${esc(c.ended||"in progress")}</div></td>
      <td class="mono">${t.length}</td><td class="mono">${coverage(c)}%</td><td>${statusPill(c)}</td><td class="arrowc">open →</td></tr>`;
  }).join("");
  return `<div class="crumb"><button onclick="go('#/')">Runs Explorer</button><span class="sep">/</span><span>${esc(m.id)}</span></div>
  <div class="dhead"><h2>${esc(m.name)}</h2><span class="pill ${m.status==="complete"?"ok":"gate"}">${esc(m.status)}</span></div>
  <div class="kv">milestone <b>${esc(m.id)}</b> · ${esc(m.window)} · owner ${esc(m.owner)}</div>
  <p class="subt" style="margin-top:8px">${esc(m.note)}</p>
  <div class="tiles">
    <div class="tile"><div class="n">${cs.length}</div><div class="l">Cycles</div><div class="s">in this milestone</div></div>
    <div class="tile"><div class="n">${ts.length}</div><div class="l">Tests</div><div class="s">across all cycles</div></div>
    <div class="tile"><div class="n">${cov}%</div><div class="l">Coverage</div><div class="s">tests passing</div></div>
    <div class="tile"><div class="n">${cs.filter(c=>c.awaiting).length}</div><div class="l">Open gates</div><div class="s">cycles waiting on a human</div></div>
  </div>
  <div class="sec"><h3>Cycles</h3><p class="h-sub">Each cycle is one pass over a target. Open one to see its tests.</p>
  <div class="tw"><table><thead><tr><th>Cycle</th><th>Name</th><th>Kind</th><th>Dates</th><th>Tests</th><th>Pass</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ── LEVEL 3 · one cycle: its tests, filterable ─────────────────────────── */
let FILTER={type:"all",area:"all"};
function setFilter(k,v){FILTER[k]=v;paint(renderCycle(CURRENT_CYCLE));}
let CURRENT_CYCLE=null;
function renderCycle(id){
  CURRENT_CYCLE=id;
  const c=CYCLES.find(x=>x.id===id);
  if(!c)return `<button class="back" onclick="go('#/')">← Runs Explorer</button><div class="empty">Cycle <b>${esc(id)}</b> not found.</div>`;
  const m=MILESTONES.find(x=>x.id===c.milestone)||{name:"—",id:""};
  const all=testsOf(c), t=agentTally(c);

  const types=[...new Set(all.flatMap(x=>[x.type,x.layer]).filter(Boolean))];
  const areas=[...new Set(all.map(x=>x.area).filter(Boolean))];
  const hit=x=>(FILTER.type==="all"||x.type===FILTER.type||x.layer===FILTER.type)&&(FILTER.area==="all"||x.area===FILTER.area);
  const shown=all.filter(hit);
  const cnt=(k,v)=>all.filter(x=>k==="type"?(x.type===v||x.layer===v):x.area===v).length;

  const chips=(k,vals)=>[`<button class="fchip ${FILTER[k]==="all"?"on":""}" onclick="setFilter('${k}','all')">All<span class="c">${all.length}</span></button>`]
    .concat(vals.map(v=>`<button class="fchip ${FILTER[k]===v?"on":""}" onclick="setFilter('${k}','${esc(v)}')">${esc(v)}<span class="c">${cnt(k,v)}</span></button>`)).join("");

  const rows=shown.map(x=>`<tr class="clk" onclick="go('#/test/${x.id}')">
    <td class="cid">${esc(x.id)}</td><td>${esc(x.title)}</td>
    <td><span class="chip ty">${esc(x.type)}</span>${x.layer?`<span class="chip ly">${esc(x.layer)}</span>`:""}</td>
    <td><span class="chip">${esc(x.area)}</span></td>
    <td>${verdictPill(x.verdict)}</td><td class="mono">${esc(x.duration||"—")}</td><td class="arrowc">agent trace →</td></tr>`).join("");

  return `<div class="crumb"><button onclick="go('#/')">Runs Explorer</button><span class="sep">/</span><button onclick="go('#/milestone/${m.id}')">${esc(m.name)}</button><span class="sep">/</span><span>${esc(c.id)}</span></div>
  <div class="dhead"><h2>${esc(c.name)}</h2>${statusPill(c)}<span class="chip">${esc(c.kind)}</span></div>
  <div class="kv">cycle <b>${esc(c.id)}</b> · target ${esc(c.target)} · ${esc(c.started)} → ${esc(c.ended||"in progress")} · source ${esc(c.source)}</div>
  <p class="subt" style="margin-top:8px">${esc(c.note)}</p>
  <div class="tiles">
    <div class="tile"><div class="n">${all.length}</div><div class="l">Tests in cycle</div><div class="s">${all.filter(x=>VER(x.verdict)==="p").length} passing</div></div>
    <div class="tile"><div class="n">${coverage(c)}%</div><div class="l">Coverage</div><div class="s">of this cycle's tests</div></div>
    <div class="tile"><div class="n">${t.ok} <span style="font-size:14px;color:var(--faint)">/ ${t.total}</span></div><div class="l">Agents ran</div><div class="s">${t.pend} not reached · ${t.na} not configured</div></div>
    <div class="tile"><div class="n">${c.awaiting||"—"}</div><div class="l">Waiting on</div><div class="s">${c.awaiting?"a human decision":"nothing — cycle closed"}</div></div>
  </div>

  <div class="sec"><h3>Tests in this cycle</h3><p class="h-sub">Filter by type or by area, or leave both on All to list everything. Open any test to see all 12 agents for that one test.</p>
  <div class="filters">
    <div class="frow"><span class="flab">Type</span>${chips("type",types)}</div>
    <div class="frow"><span class="flab">Area</span>${chips("area",areas)}</div>
  </div>
  <div class="tw"><table><thead><tr><th>Test</th><th>Flow</th><th>Type</th><th>Area</th><th>Result</th><th>Time</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No tests match this filter.</td></tr>'}</tbody></table></div></div>`;
}

/* ── LEVEL 4 · one test, traced agent by agent ─────────────────────────── */
function traceFor(test,phaseId){
  if (LIVE) return liveTrace(test, phaseId);          // real artifacts win
  const bespoke=(test.trace||{})[phaseId];
  if(bespoke)return bespoke;
  const B=BUILD[phaseId];
  return B?B(test):null;
}
const ASYNC_FIELD={"a09-performance":"perf","a10-design-parity":"parity","a11-ai-eval":"aieval","a12-drift":"drift"};
function phaseStatus(test,p){
  if (LIVE) {
    const c = CYCLES.find((x) => x.id === test.cycle) || {};
    if ((c.na || []).includes(p.id)) return "na";
    if ((c.ran || []).includes(p.id)) {
      return p.id === "05-targeted-run" && VER(test.verdict) === "f" ? "fail" : "ok";
    }
    return c.awaiting && p.gate === c.awaiting ? "gate" : "";
  }
  if((test.na||[]).includes(p.id))return "na";
  // An async track is "ran" exactly when it has data for this test — the dot can
  // never claim a track ran while the panel says it was not configured.
  if(p.kind==="async")return test[ASYNC_FIELD[p.id]]?"ok":"na";
  if((test.reached||[]).includes(p.id))return (p.id==="05-targeted-run"&&VER(test.verdict)==="f")?"fail":"ok";
  const c=CYCLES.find(x=>x.id===test.cycle);
  return c&&c.awaiting&&p.gate===c.awaiting?"gate":"";
}
function renderTest(testId,phaseId){
  const test=TESTS.find(t=>t.id===testId);
  if(!test)return `<button class="back" onclick="go('#/')">← Runs Explorer</button><div class="empty">Test <b>${esc(testId)}</b> not found.</div>`;
  const c=CYCLES.find(x=>x.id===test.cycle)||{};
  const m=MILESTONES.find(x=>x.id===c.milestone)||{};
  const cur=phaseId&&byId(phaseId)?phaseId:"00-preflight";
  const p=byId(cur);

  const item=q=>{
    const st=phaseStatus(test,q);
    const g=q.gate?`<span class="ni-g ${st==="ok"?"ok":""}">${q.gate}</span>`:"";
    const num=q.n?`<span class="ni-n">${q.n}</span>`:`<span class="ni-n" style="opacity:.4">·</span>`;
    return `<button class="nav-item ${q.id===cur?"active":""}" onclick="go('#/test/${test.id}/${q.id}')">
      <span class="ni-dot ${st==="na"?"":st}"></span>${num}<span class="ni-a">${esc(q.a)}</span>${g}</button>`;
  };
  const nav=`<div class="nav-lbl">Gated pipeline</div>${PHASES.map(item).join("")}
             <div class="nav-lbl">Async tracks · non-blocking</div>${ASYNC.map(item).join("")}`;

  const tr=traceFor(test,cur)||{in:'<p class="sub2">No input recorded for this agent on this test.</p>',out:'<p class="sub2">No output recorded.</p>'};
  const st=phaseStatus(test,p);
  const prev=prevPhase(cur), next=nextPhase(cur);
  const fromLbl=p.kind==="async"
    ? `<span class="from" style="cursor:default;color:var(--muted)">independent trigger — not fed by the pipeline</span>`
    : (prev?`<button class="from" onclick="go('#/test/${test.id}/${prev.id}')">◀ from ${esc(prev.a)} · ${esc(prev.id)}</button>`
           :`<span class="from" style="cursor:default;color:var(--muted)">the start of the chain</span>`);
  const toLbl=p.kind==="async"
    ? `<span class="from" style="cursor:default;color:var(--muted)">report only — passes to no one, blocks nothing</span>`
    : (next?`<button class="from" onclick="go('#/test/${test.id}/${next.id}')">passes to ${esc(next.a)} · ${esc(next.id)} ▶</button>`
           :`<span class="from" style="cursor:default;color:var(--muted)">end of the chain</span>`);

  const head=[
    p.n?`<span class="pill muted">agent ${p.n} of 12</span>`:`<span class="pill muted">${p.kind==="run"?"execution phase":"pre-flight check"}</span>`,
    p.kind==="async"?'<span class="pill run">async · never blocks</span>':"",
    p.gate?`<span class="pill ${st==="gate"?"gate":"ok"}">${st==="gate"?"⏸ awaiting "+p.gate:"✓ "+p.gate}</span>`:"",
  ].filter(Boolean).join("");

  // What this agent is for, independent of any one test — so a reader can
  // understand the agent on its own, not only what it did here.
  const info=AGENT_INFO[cur];
  const brief=info?`<div class="brief">
      <div class="brief-h">What this agent does</div>
      <p class="brief-does">${info.does}</p>
      <div class="brief-grid">
        <div class="brief-cell"><span class="k">The problem it solves</span><span class="v">${info.solves}</span></div>
        <div class="brief-cell never"><span class="k">It never</span><span class="v">${info.never}</span></div>
        <div class="brief-cell"><span class="k">Produces</span><span class="v">${info.out}</span></div>
      </div></div>`:"";

  const json=(o)=>o==null?"—":esc(JSON.stringify(o,null,2));
  const raw=(label,o)=>`<details class="raw"><summary><span class="tw-caret">▶</span>${esc(label)}</summary><pre>${json(o)}</pre></details>`;
  const peek=(o)=>{
    if(o==null)return "";
    const k=Object.keys(o);
    return `<span class="peek">${k.length} field${k.length!==1?"s":""} · ${esc(k.slice(0,3).join(", "))}${k.length>3?"…":""}</span>`;
  };
  // With a real run, the payloads are the artifacts themselves; the generators below only
  // know the bundled example's shape.
  const ji = LIVE ? (tr.inJson ?? null) : inJson(test, cur);
  const jo = LIVE ? (tr.outJson ?? null) : outJson(test, cur);

  return `<div class="crumb"><button onclick="go('#/')">Runs Explorer</button><span class="sep">/</span><button onclick="go('#/milestone/${m.id}')">${esc(m.name)}</button><span class="sep">/</span><button onclick="go('#/cycle/${c.id}')">${esc(c.name)}</button><span class="sep">/</span><span>${esc(test.id)}</span></div>
  <div class="dhead"><h2>${esc(test.id)} · ${esc(test.title)}</h2>${verdictPill(test.verdict)}</div>
  <div class="kv"><span class="chip ty">${esc(test.type)}</span>${test.layer?`<span class="chip ly">${esc(test.layer)}</span>`:""}<span class="chip">${esc(test.area)}</span> · traced through all 12 agents for this test alone</div>
  <div class="layout"><div class="nav">${nav}</div>
    <div class="panel">
      <div class="p-head"><span class="p-id">${esc(p.id)}</span><h3>${esc(p.a)}</h3>${head}</div>
      ${brief}
      <details class="io in" open>
        <summary><span class="tw-caret">▶</span>INPUT — what it received ${fromLbl}${peek(ji)}</summary>
        <div class="io-body">${tr.in}${raw("input payload",ji)}</div>
      </details>
      <div class="arrow">↓</div>
      <details class="io out" open>
        <summary><span class="tw-caret">▶</span>OUTPUT — what it did here ${toLbl}${peek(jo)}</summary>
        <div class="io-body">${tr.out}${raw("output payload",jo)}</div>
      </details>
      <div class="stepnav">
        ${prev?`<button onclick="go('#/test/${test.id}/${prev.id}')"><span class="lbl">◀ previous agent</span>${esc(prev.a)}</button>`:`<button disabled><span class="lbl">◀ previous agent</span>start of chain</button>`}
        ${next?`<button style="text-align:right" onclick="go('#/test/${test.id}/${next.id}')"><span class="lbl">next agent ▶</span>${esc(next.a)}</button>`:`<button disabled style="text-align:right"><span class="lbl">next agent ▶</span>end of chain</button>`}
      </div>
    </div></div>`;
}

/* ── routing ───────────────────────────────────────────────────────────── */
function paint(html){document.getElementById("app").innerHTML=html;}
function go(h){location.hash=h;}
function onSearch(v){const pos=(document.getElementById("q")||{}).selectionStart;paint(renderExplorer(v));const q=document.getElementById("q");if(q){q.focus();if(pos!=null)q.setSelectionRange(pos,pos);}}
function route(){
  const h=location.hash||"#/";let m;
  try {
    if((m=h.match(/^#\/test\/([^/]+)(?:\/(.+))?$/)))  paint(renderTest(decodeURIComponent(m[1]),m[2]?decodeURIComponent(m[2]):null));
    else if((m=h.match(/^#\/cycle\/(.+)$/)))          {FILTER={type:"all",area:"all"};paint(renderCycle(decodeURIComponent(m[1])));}
    else if((m=h.match(/^#\/milestone\/(.+)$/)))      paint(renderMilestone(decodeURIComponent(m[1])));
    else                                              paint(renderExplorer(""));
  } catch (e) {
    // A view that throws used to leave the previous screen on the page, so a click looked like
    // it did nothing. Say what broke instead, and keep the board navigable.
    paint(`<button class="back" onclick="go('#/')">← Runs Explorer</button>
      <div class="banner bad"><b>This view failed to render</b>
        <span class="mono">${esc(String(e && e.message || e))}</span>
        <div class="sub2">Route <span class="mono">${esc(h)}</span>. The rest of the board still works.</div>
      </div>`);
    if (window.console) console.error("AQA dashboard render failed on", h, e);
  }
  window.scrollTo(0,0);
}
// Theme: dark unless the reader has asked for light. localStorage can throw in a private
// window or with site data blocked, so every access is guarded and the page still renders.
(function theme() {
  const KEY = "aqa.theme";
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  const apply = (t) => document.documentElement.setAttribute("data-theme", t);
  apply(saved === "dark" ? "dark" : "light");
  const btn = document.getElementById("themeToggle");
  const paint = () => { btn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "◐" : "◑"; };
  paint();
  btn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    apply(next); paint();
    try { localStorage.setItem(KEY, next); } catch {}
  });
})();

window.addEventListener("hashchange",route);route();
</script></body></html>
