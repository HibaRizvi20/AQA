<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQA Runs Explorer</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--surface2:#eef1f5;--border:#e2e6ec;--ink:#0f1216;--muted:#5a6472;--faint:#8a93a1;--accent:#4f46e5;--accent-soft:#ecebfb;--ok:#12a150;--ok-soft:#e6f6ec;--gate:#b7791f;--gate-soft:#fbf1df;--fail:#d64550;--fail-soft:#fce8ea;--run:#2f6feb;--run-soft:#e6effc;--stub:#8a93a1;--mono:ui-monospace,Menlo,Consolas,monospace;--shadow:0 1px 2px rgba(16,18,22,.05),0 8px 24px rgba(16,18,22,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0c0e12;--surface:#14171d;--surface2:#1b1f27;--border:#262b34;--ink:#e8ebf0;--muted:#98a2b2;--faint:#69727f;--accent:#8b83ff;--accent-soft:#1e1b3a;--ok:#3fb950;--ok-soft:#12241a;--gate:#d6a531;--gate-soft:#2a2113;--fail:#f0616a;--fail-soft:#2a1417;--run:#5b9bff;--run-soft:#14233d;--stub:#69727f;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:26px 20px 70px}
.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:700;color:var(--accent);margin:0 0 5px}
h1{font-size:clamp(21px,2.8vw,27px);line-height:1.12;margin:0 0 5px;letter-spacing:-.02em}
.subt{color:var(--muted);font-size:13.5px;margin:0}
.search{display:flex;gap:10px;align-items:center;margin:18px 0 6px}
.search input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font:inherit;font-size:14px;color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.count{font-size:12.5px;color:var(--faint);white-space:nowrap}
.runs{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.run{display:grid;grid-template-columns:150px 1fr 160px 130px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%;font:inherit;color:inherit}
.run:hover{border-color:var(--accent)}
@media(max-width:720px){.run{grid-template-columns:1fr;gap:6px}}
.rid{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}.rid .k{display:block;color:var(--faint);font-size:10.5px;margin-top:2px}
.rname{font-weight:650;font-size:14px}.rname .m{display:block;color:var(--muted);font-size:11.5px;font-weight:500;margin-top:2px}
.rprog{font-size:12px;color:var(--muted)}.rbar{height:7px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-top:5px}.rbar>i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.gate{background:var(--gate-soft);color:var(--gate)}.pill.fail{background:var(--fail-soft);color:var(--fail)}.pill.run{background:var(--run-soft);color:var(--run)}.pill.muted{background:var(--surface);color:var(--faint)}
.empty{color:var(--faint);font-size:13.5px;text-align:center;padding:34px}
.back{display:inline-flex;gap:7px;align-items:center;background:none;border:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:4px}
.dhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin:2px 0 3px}.dhead h2{font-size:20px;margin:0;letter-spacing:-.01em}
.kv{font-size:12.5px;color:var(--muted)}.kv b{color:var(--ink);font-family:var(--mono);font-size:12px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start;margin-top:14px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;font-size:12.5px}
.nav-item:hover{border-color:var(--accent)}.nav-item.active{background:var(--accent-soft);border-color:var(--accent)}
.ni-dot{width:9px;height:9px;border-radius:50%;background:var(--stub);flex:none}.ni-dot.ok{background:var(--ok)}.ni-dot.gate{background:var(--gate)}
.ni-id{font-family:var(--mono);font-size:10px;color:var(--faint)}.ni-a{font-weight:600;flex:1}
.ni-g{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:10px;background:var(--gate-soft);color:var(--gate)}.ni-g.ok{background:var(--ok-soft);color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:2px}.p-head h3{font-size:18px;margin:0}.p-id{color:var(--faint);font-size:12px;font-family:var(--mono)}
.io{border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin:10px 0}.io.in{background:var(--surface2)}.io.out{background:var(--accent-soft)}
.io-h{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
.io p{font-size:13.5px;margin:6px 0}.arrow{text-align:center;font-size:11px;color:var(--faint);margin:2px 0}
.mono{font-family:var(--mono);font-size:12px}
pre{font-family:var(--mono);font-size:11.6px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 13px;overflow-x:auto;white-space:pre-wrap;margin:6px 0;line-height:1.5}
.gherkin .kw{color:var(--accent);font-weight:700}
.sub{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 3px}.sub2{font-size:11px;color:var(--faint);display:block;margin-top:6px}
.chip{font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted);display:inline-block;margin:2px 2px 0 0}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.sbar{display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--surface);margin:2px 0 8px;border:1px solid var(--border)}.seg{height:100%}.seg.ok{background:var(--ok)}.seg.gate{background:var(--gate)}.seg.stub{background:var(--stub)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.dot.ok{background:var(--ok)}.dot.gate{background:var(--gate)}.dot.stub{background:var(--stub)}
ol,ul{margin:6px 0;padding-left:20px}li{margin:4px 0;font-size:12.8px}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const PHASES=[{id:"00-preflight",a:"Pre-flight"},{id:"01-scope",a:"Scope Analyst"},{id:"02-architecture",a:"Test Architect",gate:"CP1"},{id:"03-case-design",a:"Case Designer",gate:"CP2"},{id:"3b-publish",a:"Tracker Publisher"},{id:"04-generate",a:"Test Generator",gate:"CP3"},{id:"05-targeted-run",a:"Targeted Run",gate:"CP4"},{id:"06-self-heal",a:"Triage / Self-Heal"},{id:"07-regression",a:"Regression"},{id:"08-review",a:"Reviewer",gate:"CP5"},{id:"09-finalise",a:"Finalise + KB"}];
const CART={
"00-preflight":{in:`<p>The feature spec (a plain request, no tracker key yet):</p><pre>As a shopper I want to save items for later from my cart,\nso I can move them out of the active cart and bring them back.</pre>`,
 out:`<p>Checked prerequisites and probed the app:</p><span class="chip">deps: <b>ok</b></span><span class="chip">app reachable: <b>ok</b></span><span class="chip">"Save for later" control: <b>not built yet</b></span><p class="sub2">Surfaced (not masked): the control does not exist yet, so later phases skip honestly rather than invent selectors.</p>`},
"01-scope":{in:`<p>The spec. No epic to traverse, so the analyst decomposes it into candidate behaviours and classifies each.</p>`,
 out:`<div class="sbar"><span class="seg ok" style="width:75%"></span><span class="seg gate" style="width:12.5%"></span><span class="seg stub" style="width:12.5%"></span></div><div class="legend"><span><i class="dot ok"></i>In scope 6</span><span><i class="dot gate"></i>Deferred 1</span><span><i class="dot stub"></i>Out 1</span> · confidence 60%</div>
 <div class="sub">In scope</div><table><thead><tr><th>Behaviour</th><th>Area</th></tr></thead><tbody><tr><td>"Save for later" moves an item out of the active cart</td><td>cart</td></tr><tr><td>Saved items appear in a "Saved" list</td><td>cart</td></tr><tr><td>"Move to cart" returns a saved item</td><td>cart</td></tr><tr><td>Saved items persist across sessions</td><td>cart</td></tr><tr><td>Saved items are excluded from the cart total</td><td>cart</td></tr><tr><td>Remove a saved item</td><td>cart</td></tr></tbody></table>
 <div class="sub">Deferred</div><p>Saved-item price updates when the catalogue price changes — needs a pricing event, not a UI test.</p><div class="sub">Out of scope</div><p>Cart persistence storage internals → performance track.</p><p class="sub2">Confidence 0.60 — clear behaviour, but the control isn't built and no selectors exist to verify. Forces the CP1 review.</p>`},
"02-architecture":{in:`<p>The classified scope (6 in-scope behaviours, 1 deferred).</p>`,
 out:`<p>One objective per behaviour with a positive / negative / edge split.</p><table><thead><tr><th>Objective</th><th>+/–/edge</th></tr></thead><tbody><tr><td>Save for later moves the item</td><td><span class="pill ok">positive</span></td></tr><tr><td>Move to cart returns it</td><td><span class="pill ok">positive</span></td></tr><tr><td>Saved list persists across sessions</td><td><span class="pill ok">positive</span></td></tr><tr><td>Saved items excluded from total</td><td><span class="pill ok">positive</span></td></tr><tr><td>Save-for-later on an out-of-stock item is blocked</td><td><span class="pill fail">negative</span></td></tr><tr><td>Save the last cart item (cart goes empty)</td><td><span class="pill gate">edge</span></td></tr><tr><td>Remove a saved item</td><td><span class="pill muted">lifecycle</span></td></tr></tbody></table><p class="sub2"><b>Pilot:</b> save-for-later + move-to-cart.</p>`},
"03-case-design":{in:`<p>The objectives + the pos/neg/edge plan.</p>`,
 out:`<p>A co-located Gherkin feature — <span class="mono">tests/features/cart-save-for-later.feature</span> — stakeholder-readable, each scenario doubling as a test case.</p>
 <pre class="gherkin"><span class="kw">Feature:</span> Save cart items for later\n\n  <span class="kw">Background:</span>\n    <span class="kw">Given</span> I am signed in to Acme Shop\n    <span class="kw">And</span> I have two items in my cart\n\n  <span class="kw">Scenario:</span> AQA-201 Save an item for later\n    <span class="kw">When</span> I choose "Save for later" on an item\n    <span class="kw">Then</span> it moves to my "Saved" list and leaves the active cart\n\n  <span class="kw">Scenario:</span> AQA-202 Move a saved item back to the cart\n  <span class="kw">Scenario:</span> AQA-203 Saved items persist after I sign out and back in\n  <span class="kw">Scenario:</span> AQA-204 Saved items are not counted in the cart total\n  <span class="kw">Scenario:</span> AQA-205 Saving an out-of-stock item is blocked\n  <span class="kw">Scenario:</span> AQA-206 Saving the last cart item leaves an empty cart cleanly\n  <span class="kw">Scenario:</span> AQA-207 Remove a saved item</pre>
 <div class="sub">Tags — auto-stamped, pick by area / type</div><p><span class="chip">@area:cart</span><span class="chip">@type:happy ×4</span><span class="chip">@type:negative ×1</span><span class="chip">@type:edge ×1</span><span class="chip">@type:lifecycle ×1</span></p>
 <div class="sub2">~90% of the UI surface covered; the price-change-on-saved-item behaviour is deferred (needs a pricing event). Open questions at CP2: is there a saved-item cap? do saved items reserve stock?</div>`},
};
const BLOCKED=`<p class="sub2">Not reached — this run paused at CP2 because the "Save for later" control isn't built yet, so generation/run would have to invent selectors. Shown as it will run once the feature ships.</p>`;
for(const id of ["3b-publish","04-generate","05-targeted-run","06-self-heal","07-regression","08-review","09-finalise"]) CART[id]={in:BLOCKED,out:BLOCKED};
const RUNS=[
 {runId:"r-chk-9f", epicKey:"AQA-EP-CHECKOUT", name:"Checkout hardening", source:"tracker", started:"2026-09-01 10:12", status:"complete", def:"01-scope", done:PHASES.map(p=>p.id), awaiting:null,
  counts:{"00-preflight":"4 checks ok","01-scope":"12 in · 2 deferred · 3 out · conf 84%","02-architecture":"9 objectives · pilot: checkout","03-case-design":"1 feature · 4 scenarios","3b-publish":"4 test cases (dry-run)","04-generate":"1 step-def · 4 specs","05-targeted-run":"4 ran · 4 passed","06-self-heal":"0 healed · 0 bugs","07-regression":"140 / 140 passed","08-review":"3 findings · 0 blocking","09-finalise":"1 KB entry"}},
 {runId:"r-srch-2a", epicKey:"AQA-EP-SEARCH", name:"Search relevance", source:"tracker", started:"2026-09-01 11:40", status:"complete", def:"01-scope", done:PHASES.map(p=>p.id), awaiting:null,
  counts:{"00-preflight":"4 checks ok","01-scope":"8 in · 1 deferred · 2 out","02-architecture":"6 objectives · pilot: search","03-case-design":"1 feature · 3 scenarios","3b-publish":"3 test cases (dry-run)","04-generate":"1 step-def · 3 specs","05-targeted-run":"3 ran · 2 pass · 1 fail","06-self-heal":"1 healed · 0 bugs","07-regression":"140 / 140 passed","08-review":"2 findings · 0 blocking","09-finalise":"1 KB entry"}},
 {runId:"r-cart-7c", epicKey:"spec:cart-save-for-later", name:"Save cart items for later", source:"feature spec", started:"2026-09-02 09:05", status:"paused", def:"03-case-design", done:["00-preflight","01-scope","02-architecture","03-case-design"], awaiting:"CP2", rich:CART,
  counts:{"00-preflight":"prereqs ok · control not built","01-scope":"6 in · 1 deferred · 1 out · conf 60%","02-architecture":"7 objectives · pilot: cart","03-case-design":"1 feature · 7 scenarios (tagged)"}},
 {runId:"r-acct-4b", epicKey:"AQA-EP-ACCOUNT", name:"Account & profile", source:"tracker", started:"2026-08-31 16:20", status:"complete", def:"01-scope", done:PHASES.map(p=>p.id), awaiting:null,
  counts:{"00-preflight":"4 checks ok","01-scope":"5 in · 1 out","02-architecture":"4 objectives","03-case-design":"1 feature · 3 scenarios","3b-publish":"3 test cases","04-generate":"1 step-def","05-targeted-run":"3 ran · 3 passed","06-self-heal":"0 healed","07-regression":"140 / 140 passed","08-review":"0 findings","09-finalise":"1 KB entry"}},
];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function statusPill(r){if(r.status==="complete")return '<span class="pill ok">complete</span>';if(r.status==="paused")return '<span class="pill gate">paused · awaiting '+r.awaiting+'</span>';if(r.status==="running")return '<span class="pill run">running · '+(r.awaiting||'…')+'</span>';return '<span class="pill">'+esc(r.status)+'</span>';}
function gateState(r,g){if(r.awaiting===g)return "wait";const ph=PHASES.find(p=>p.gate===g);return ph&&r.done.includes(ph.id)?"ok":"";}
function autoIn(r,p){const M={"00-preflight":`Trigger: scope link <span class="mono">${esc(r.source)}:${esc(r.epicKey)}</span>.`,"01-scope":"The scope link — fetched its children.","02-architecture":"The scope artifact (01-scope).","03-case-design":"The plan (02-architecture).","3b-publish":"The approved Gherkin scenarios (03).","04-generate":"The features (03-cases).","05-targeted-run":"The generated specs (04).","06-self-heal":"Failures from the targeted run (05).","07-regression":"The whole suite.","08-review":"The generated tests + conventions.","09-finalise":"The run artifacts."};return "<p>"+(M[p.id]||"—")+"</p>";}
function autoOut(r,p){return r.done.includes(p.id)?"<p><b>"+esc(r.counts[p.id]||"done")+"</b></p>":'<p class="sub2">pending</p>';}
function renderIndex(q){q=(q||"").trim().toLowerCase();const list=RUNS.filter(r=>!q||[r.runId,r.epicKey,r.name,r.status,r.source].join(" ").toLowerCase().includes(q));
 const rows=list.map(r=>{const n=r.done.length,pct=Math.round(n/PHASES.length*100);return `<button class="run" onclick="location.hash='#/run/${r.runId}'"><div class="rid">${esc(r.runId)}<span class="k">${esc(r.epicKey)}</span></div><div class="rname">${esc(r.name)}<span class="m">${esc(r.source)} · started ${esc(r.started)}</span></div><div class="rprog">${n}/${PHASES.length} phases<div class="rbar"><i style="width:${pct}%"></i></div></div><div>${statusPill(r)}</div></button>`;}).join("");
 return `<p class="eyebrow">AQA · Autonomous QA</p><h1>Runs Explorer</h1><p class="subt">Every run is a trace — find one by run id, epic, name or status, then open it to watch the data flow phase-by-phase (input → output). Parallel runs live side by side.</p><div class="search"><input id="q" type="search" placeholder="Search — checkout, search, paused, r-cart-7c…" value="${esc(q)}" oninput="onSearch(this.value)"><span class="count">${list.length} / ${RUNS.length} runs</span></div><div class="runs">${rows||'<div class="empty">No runs match “'+esc(q)+'”.</div>'}</div><div class="legend" style="margin-top:16px"><span><i class="dot ok"></i>complete</span><span><i class="dot gate"></i>paused / awaiting gate</span></div>`;}
function renderDetail(runId,phaseId){const r=RUNS.find(x=>x.runId===runId);if(!r)return `<button class="back" onclick="location.hash='#/'">← all runs</button><div class="empty">Run <b>${esc(runId)}</b> not found.</div>`;
 const cur=phaseId&&PHASES.find(p=>p.id===phaseId)?phaseId:(r.def||"01-scope");
 const nav=PHASES.map(p=>{const st=r.done.includes(p.id)?"ok":(r.awaiting&&p.gate===r.awaiting?"gate":"");const g=p.gate?`<span class="ni-g ${gateState(r,p.gate)==='ok'?'ok':''}">${p.gate}</span>`:"";return `<button class="nav-item ${p.id===cur?'active':''}" onclick="location.hash='#/run/${r.runId}/${p.id}'"><span class="ni-dot ${st}"></span><span class="ni-id">${p.id}</span><span class="ni-a">${esc(p.a)}</span>${g}</button>`;}).join("");
 const p=PHASES.find(x=>x.id===cur);const rich=r.rich&&r.rich[cur];const inHtml=rich?rich.in:autoIn(r,p);const outHtml=rich?rich.out:autoOut(r,p);
 const gchip=p.gate?`<span class="pill ${gateState(r,p.gate)==='wait'?'gate':'ok'}">${gateState(r,p.gate)==='wait'?'⏸ awaiting '+p.gate:'✓ '+p.gate}</span>`:"";
 const panel=`<div class="panel"><div class="p-head"><span class="p-id">${p.id}</span><h3>${esc(p.a)}</h3>${gchip}</div><div class="io in"><div class="io-h">▸ INPUT — what it received</div>${inHtml}</div><div class="arrow">↓ passes to output ↓</div><div class="io out"><div class="io-h">▪ OUTPUT — what it produced</div>${outHtml}</div></div>`;
 return `<button class="back" onclick="location.hash='#/'">← all runs</button><div class="dhead"><h2>${esc(r.name)}</h2>${statusPill(r)}</div><div class="kv">run id <b>${esc(r.runId)}</b> · epic <b>${esc(r.epicKey)}</b> · ${esc(r.source)} · started ${esc(r.started)}</div><div class="layout"><div class="nav">${nav}</div>${panel}</div>`;}
function onSearch(v){const app=document.getElementById("app");const inp=document.getElementById("q");const pos=inp?inp.selectionStart:null;app.innerHTML=renderIndex(v);const q2=document.getElementById("q");if(q2){q2.focus();if(pos!=null)q2.setSelectionRange(pos,pos);}}
function route(){const h=location.hash||"#/";const m=h.match(/^#\/run\/([^/]+)(?:\/(.+))?$/);document.getElementById("app").innerHTML=m?renderDetail(decodeURIComponent(m[1]),m[2]?decodeURIComponent(m[2]):null):renderIndex("");window.scrollTo(0,0);}
window.addEventListener("hashchange",route);route();
</script></body></html>
